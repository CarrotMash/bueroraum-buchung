  function renderUebersicht() {
    var isAdmin = state.profile && state.profile.is_admin;
    var scopeLabel = isAdmin ? "Alle Gruppen (Admin-Ansicht)" : (groupById(state.profile.group_id) ? groupById(state.profile.group_id).name : "");
    var html = '<div class="group-heading">' + escapeHtml(scopeLabel) + '</div>';
    html += '<div class="card"><h3>' + (isAdmin ? "Gesamt-Übersicht" : "Team-Übersicht") + '</h3><div class="modal-sub">' + (isAdmin ? "Alle Buchungen und Urlaubstage aller Gruppen für die nächsten " : "Alle Buchungen und Urlaubstage deiner Gruppe für die nächsten ") + WORKDAY_COUNT + ' Arbeitstage.</div></div>';
    state.dates.forEach(function (d) {
      var iso = fmtISO(d);
      var dayBookings = state.bookings.filter(function (b) { return b.booking_date === iso; })
        .sort(function (a, b) { return a.room_number.localeCompare(b.room_number) || a.workspace_id.localeCompare(b.workspace_id) || byStart(a, b); });
      var dayVacations = state.vacations.filter(function (v) { return v.vacation_date === iso; });
      html += '<div class="card"><h3>' + DOW[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + '</h3>';
      if (!dayBookings.length && !dayVacations.length) {
        html += '<div class="empty-state">Keine Einträge.</div>';
      } else {
        dayBookings.forEach(function (b) {
          var room = findRoomByNumber(b.room_number);
          var ws = room ? room.workspaces.find(function (w) { return w.id === b.workspace_id; }) : null;
          var owner = profileById(b.user_id);
          html += '<div class="admin-row"><span>' + (room ? escapeHtml(room.label) : b.room_number) + (ws ? ' · ' + escapeHtml(ws.label) : '') + ' · ' + bookingTimeLabel(b) + '</span><span>' + escapeHtml(owner ? owner.full_name : "?") + '</span></div>';
        });
        if (dayVacations.length) {
          var names = dayVacations.map(function (v) { var o = profileById(v.user_id); return escapeHtml(o ? o.full_name : "?"); }).join(", ");
          html += '<div class="room-note" style="margin-top:8px">Urlaub: ' + names + '</div>';
        }
      }
      html += '</div>';
    });
    return html;
  }

  function renderAuswertung() {
    if (!state.profile || !state.profile.is_admin) {
      return '<div class="card"><h3>Auswertungen</h3><div class="empty-state">Dieser Bereich ist nur für Administrator:innen sichtbar.</div></div>';
    }

    var html = '<div class="card"><h3>Buchungshäufigkeit je Raum</h3>';
    html += '<div class="modal-sub">Anzahl und gebuchte Stunden je Raum in einem frei wählbaren Zeitraum (nach Datum der Buchung).</div>';
    html += '<label for="freqFrom">Von</label><input type="date" id="freqFrom" value="' + escapeHtml(state.report.freqFrom || '') + '">';
    html += '<label for="freqTo">Bis</label><input type="date" id="freqTo" value="' + escapeHtml(state.report.freqTo || '') + '">';
    html += '<div style="height:10px"></div><button class="btn-primary" id="runFreqBtn"' + (state.report.freqLoading ? " disabled" : "") + '>' + (state.report.freqLoading ? "Lädt…" : "Auswerten") + '</button>';
    if (state.report.freqRows) {
      if (!state.report.freqRows.length) { html += '<div class="empty-state">Keine Buchungen im gewählten Zeitraum.</div>'; }
      else {
        state.report.freqRows.forEach(function (row) {
          html += '<div class="admin-row"><span>' + escapeHtml(row.label) + '</span><span>' + row.count + ' Buchung(en) · ' + durationLabel(row.minutes) + '</span></div>';
        });
      }
    }
    html += '</div>';

    html += '<div class="card"><h3>Buchungsprotokoll</h3>';
    html += '<div class="modal-sub">Wer hat wann welche Buchung angelegt oder storniert – bleibt auch nach Stornierung erhalten.</div>';
    html += '<label for="logFrom">Von</label><input type="date" id="logFrom" value="' + escapeHtml(state.report.logFrom || '') + '">';
    html += '<label for="logTo">Bis</label><input type="date" id="logTo" value="' + escapeHtml(state.report.logTo || '') + '">';
    html += '<div style="height:10px"></div><button class="btn-primary" id="runLogBtn"' + (state.report.logLoading ? " disabled" : "") + '>' + (state.report.logLoading ? "Lädt…" : "Protokoll laden") + '</button>';
    if (state.report.logRows) {
      if (!state.report.logRows.length) { html += '<div class="empty-state">Keine Einträge im gewählten Zeitraum.</div>'; }
      else {
        state.report.logRows.forEach(function (r) {
          var dt = new Date(r.event_at);
          var stamp = pad(dt.getDate()) + "." + pad(dt.getMonth() + 1) + "." + dt.getFullYear() + " " + pad(dt.getHours()) + ":" + pad(dt.getMinutes());
          var actor = profileById(r.acted_by);
          var owner = profileById(r.user_id);
          var room = findRoomByNumber(r.room_number);
          var ws = room ? room.workspaces.find(function (w) { return w.id === r.workspace_id; }) : null;
          var actionLabel = r.action === "created" ? "Angelegt" : (r.action === "changed" ? "Geändert" : "Storniert");
          // Gelöschte Konten erscheinen im Protokoll ohne Namen (Verweis wird beim Löschen entfernt)
          var byWhom = escapeHtml(actor ? actor.full_name : "gelöschtes Konto");
          if (owner && (!actor || owner.id !== actor.id)) byWhom += " (für " + escapeHtml(owner.full_name) + ")";
          else if (actor && !owner) byWhom += " (für gelöschtes Konto)";
          var bd = parseISO(r.booking_date);
          html += '<div class="admin-row" style="align-items:flex-start"><span>' + stamp + '<br><span style="color:var(--text-muted)">' + actionLabel + ' von ' + byWhom + '</span></span>';
          html += '<span style="text-align:right">' + (room ? escapeHtml(room.label) : r.room_number) + (ws ? ' · ' + escapeHtml(ws.label) : '') + '<br><span style="color:var(--text-muted)">' + DOW[bd.getDay()] + ', ' + bd.getDate() + '. ' + MONTHS[bd.getMonth()] + ' · ' + (r.action === "changed" && r.prev_start_time ? escapeHtml(fmtMin(toMin(r.prev_start_time)) + '–' + fmtMin(toMin(r.prev_end_time)) + ' → ') : '') + escapeHtml(bookingTimeLabel(r)) + '</span></span></div>';
        });
      }
    }
    html += '</div>';

    return html;
  }

  function renderModal() {
    var m = state.modal; if (!m) return "";
    if (m.type === "cancel") {
      var cb = m.booking, cd = parseISO(cb.booking_date);
      var ch = '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">';
      ch += '<h3>Buchung wirklich stornieren?</h3>';
      ch += '<div class="confirm-summary">';
      ch += '<div class="confirm-row"><span>Arbeitsplatz</span><b>' + escapeHtml(workspaceLabelFor(cb)) + '</b></div>';
      ch += '<div class="confirm-row"><span>Datum</span><b>' + DOW[cd.getDay()] + ', ' + cd.getDate() + '. ' + MONTHS[cd.getMonth()] + '</b></div>';
      ch += '<div class="confirm-row"><span>Zeitraum</span><b>' + escapeHtml(bookingTimeLabel(cb)) + '</b></div>';
      ch += '</div>';
      ch += '<div class="modal-sub">Der Platz wird damit für andere wieder freigegeben. Das lässt sich nicht rückgängig machen – bei Bedarf einfach neu buchen.</div>';
      ch += '<div class="modal-actions"><button class="btn-secondary" id="modalCancel">Behalten</button>';
      ch += '<button class="btn-primary btn-danger-solid" id="modalConfirm"' + (m.busy ? ' disabled' : '') + '>' + (m.busy ? 'Wird storniert…' : 'Ja, stornieren') + '</button></div></div></div>';
      return ch;
    }
    if (m.type !== "book") return "";
    var html = '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">';
    var isEdit = m.mode === "edit";
    html += '<h3>' + (isEdit ? 'Buchung anpassen' : 'Arbeitsplatz buchen') + '</h3>';
    var d = parseISO(m.dateISO);
    var errs = modalErrors(m);
    var unchanged = isEdit && m.start === m.origStart && m.end === m.origEnd;
    html += '<div class="confirm-summary">';
    html += '<div class="confirm-row"><span>Arbeitsplatz</span><b>' + escapeHtml(m.room.label) + ' · ' + escapeHtml(m.workspace.label) + '</b></div>';
    html += '<div class="confirm-row"><span>Datum</span><b>' + DOW[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + '</b></div>';
    if (isEdit) html += '<div class="confirm-row"><span>Bisher</span><b>' + rangeLabel(m.origStart, m.origEnd) + '</b></div>';
    html += '</div>';
    html += '<label>Schnellauswahl</label><div class="preset-row">';
    presetsForMe().forEach(function (p) {
      var active = p.start === m.start && p.end === m.end;
      html += '<button type="button" class="preset-chip' + (active ? ' active' : '') + (p.fav ? ' fav' : '') + '" data-preset="' + p.key + '">' + (p.fav ? '★ ' : '') + p.label + '<small>' + fmtMin(p.start) + '–' + fmtMin(p.end) + '</small></button>';
    });
    html += '</div>';
    html += '<div class="time-row"><div><label for="slotStart">Von</label><select id="slotStart">';
    for (var t = DAY_START; t < DAY_END; t += STEP_MIN) html += '<option value="' + t + '"' + (t === m.start ? ' selected' : '') + '>' + fmtMin(t) + ' Uhr</option>';
    html += '</select></div><div><label for="slotEnd">Bis</label><select id="slotEnd">';
    for (var u = DAY_START + STEP_MIN; u <= DAY_END; u += STEP_MIN) html += '<option value="' + u + '"' + (u === m.end ? ' selected' : '') + '>' + fmtMin(u) + ' Uhr</option>';
    html += '</select></div></div>';
    html += timelineHtml(m.workspace.id, m.dateISO, { sel: [Math.min(m.start, m.end), Math.max(m.start, m.end)], selBad: errs.length > 0, excludeId: isEdit ? m.bookingId : null });
    var favNow = myFavorite();
    var selOk = m.end > m.start && m.start >= DAY_START && m.end <= DAY_END && m.end - m.start <= MAX_DURATION;
    if (favNow && favNow.start === m.start && favNow.end === m.end) {
      html += '<div class="fav-line">★ Das ist deine Lieblingszeit · <button type="button" class="link-btn" id="favRemove">Favorit entfernen</button></div>';
    } else if (selOk && !hasPermanentDesk()) {
      html += '<div class="fav-line"><button type="button" class="link-btn" id="favSave">☆ ' + rangeLabel(m.start, m.end) + ' als Favorit speichern</button>' + (favNow ? ' <span>(ersetzt ' + fmtMin(favNow.start) + '–' + fmtMin(favNow.end) + ')</span>' : '') + '</div>';
    }
    html += '<div class="duration-note">Dauer: <b>' + (m.end > m.start ? durationLabel(m.end - m.start) : '–') + '</b> <span>(max. 10,5 Std.)</span></div>';
    if (errs.length) html += '<div class="slot-errors">' + errs.map(function (x) { return '<div>' + escapeHtml(x) + '</div>'; }).join('') + '</div>';
    html += '<div class="modal-actions"><button class="btn-secondary" id="modalCancel">Abbrechen</button>';
    html += '<button class="btn-primary" id="modalConfirm"' + (errs.length || m.busy || unchanged ? ' disabled' : '') + '>' + (m.busy ? (isEdit ? 'Wird gespeichert…' : 'Wird gebucht…') : (isEdit ? 'Änderung speichern' : 'Jetzt buchen')) + '</button></div></div></div>';
    return html;
  }

  function bindShell() {
    document.getElementById("logoutBtn").addEventListener("click", signOut);
    var themeBtn = document.getElementById("themeBtn");
    if (themeBtn) themeBtn.addEventListener("click", toggleTheme);
    applyThemeButtonLabel();
    document.querySelectorAll("nav.tabs button").forEach(function (btn) {
      btn.addEventListener("click", function () { state.tab = btn.getAttribute("data-tab"); render(); });
    });
    document.getElementById("adminLink").addEventListener("click", function () { state.tab = "admin"; render(); });
    var reportsLink = document.getElementById("reportsLink");
    if (reportsLink) reportsLink.addEventListener("click", function () { state.tab = "auswertung"; render(); });

    document.querySelectorAll(".date-chip").forEach(function (chip) {
      chip.addEventListener("click", function () { state.selectedDate = chip.getAttribute("data-date"); render(); });
    });
    // Nach jedem Rendern (z. B. nach Klick auf einen Tag) den ausgewählten Tag im Tagesstreifen
    // sichtbar halten, statt dass der Streifen an den Anfang zurückspringt.
    var activeDateChip = document.querySelector(".date-chip.active");
    if (activeDateChip) activeDateChip.scrollIntoView({ inline: "nearest", block: "nearest" });
    document.querySelectorAll(".slot-btn.free").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var room = findRoomByNumber(btn.getAttribute("data-room"));
        var ws = room.workspaces.find(function (w) { return w.id === btn.getAttribute("data-ws"); });
        openBookingModal(room, ws, state.selectedDate, null);
      });
    });
    // Tippen auf eine freie Stelle der Zeitleiste: Buchung ab dieser halben Stunde vorschlagen
    document.querySelectorAll(".tl-track.tl-click").forEach(function (track) {
      track.addEventListener("click", function (e) {
        var rect = track.getBoundingClientRect();
        var minute = DAY_START + Math.floor(((e.clientX - rect.left) / rect.width) * TL_SPAN / STEP_MIN) * STEP_MIN;
        minute = Math.max(DAY_START, Math.min(DAY_END - STEP_MIN, minute));
        var room = findRoomByNumber(track.getAttribute("data-tl-room"));
        var ws = room.workspaces.find(function (w) { return w.id === track.getAttribute("data-tl-ws"); });
        var inFree = freeIntervals(ws.id, state.selectedDate).some(function (iv) { return minute >= iv[0] && minute < iv[1]; });
        if (!inFree) { showToast("Um " + fmtMin(minute) + " Uhr ist dieser Platz nicht frei."); return; }
        openBookingModal(room, ws, state.selectedDate, minute);
      });
    });
    document.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); openEditModal(btn.getAttribute("data-edit")); });
    });
    document.querySelectorAll("[data-cancel]").forEach(function (btn) { btn.addEventListener("click", function () { askCancelBooking(btn.getAttribute("data-cancel")); }); });
    document.querySelectorAll("[data-cancel-inline]").forEach(function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); askCancelBooking(btn.getAttribute("data-cancel-inline")); });
    });
    document.querySelectorAll("[data-rmvac]").forEach(function (btn) { btn.addEventListener("click", function () { removeVacation(btn.getAttribute("data-rmvac")); }); });

    var vacStartEl = document.getElementById("vacStart"), vacEndEl = document.getElementById("vacEnd");
    if (vacStartEl) vacStartEl.addEventListener("change", function () {
      state.vacForm.start = vacStartEl.value;
      if (state.vacForm.end && state.vacForm.end < state.vacForm.start) state.vacForm.end = "";
      render();
    });
    if (vacEndEl) vacEndEl.addEventListener("change", function () { state.vacForm.end = vacEndEl.value; render(); });
    document.querySelectorAll("[data-vcal-open]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var which = btn.getAttribute("data-vcal-open"), vf = state.vacForm;
        if (vf.open === which) { vf.open = null; render(); return; }
        vf.open = which;
        var base = (which === "end" ? (vf.end || vf.start) : vf.start) || fmtISO(new Date());
        vf.calMonth = base.slice(0, 7);
        render();
      });
    });
    document.querySelectorAll("[data-vcal-nav]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var ym = state.vacForm.calMonth.split("-");
        var d = new Date(parseInt(ym[0], 10), parseInt(ym[1], 10) - 1 + parseInt(btn.getAttribute("data-vcal-nav"), 10), 1);
        state.vacForm.calMonth = d.getFullYear() + "-" + pad(d.getMonth() + 1);
        render();
      });
    });
    document.querySelectorAll("[data-vcal-day]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var iso = btn.getAttribute("data-vcal-day"), vf = state.vacForm;
        if (vf.open === "start") {
          vf.start = iso;
          if (!vf.end || vf.end < iso) { vf.end = vf.end && vf.end >= iso ? vf.end : ""; vf.open = "end"; vf.calMonth = iso.slice(0, 7); }
          else vf.open = null;
        } else { vf.end = iso; vf.open = null; }
        render();
      });
    });
    var addVacBtn = document.getElementById("addVacBtn");
    if (addVacBtn) addVacBtn.addEventListener("click", function () {
      var startVal = document.getElementById("vacStart").value;
      var endVal = document.getElementById("vacEnd").value;
      if (!startVal || !endVal) { showToast("Bitte Start- und Enddatum wählen."); return; }
      if (endVal < startVal) { showToast("Das Enddatum muss nach dem Startdatum liegen."); return; }
      addVacationRange(startVal, endVal);
    });
    var savePermBtn = document.getElementById("savePermBtn");
    if (savePermBtn) savePermBtn.addEventListener("click", function () {
      var newMap = {};
      document.querySelectorAll("select[data-ws]").forEach(function (sel) { newMap[sel.getAttribute("data-ws")] = sel.value; });
      savePermanentAssignments(newMap);
    });
    var addGroupBtn = document.getElementById("addGroupBtn");
    if (addGroupBtn) addGroupBtn.addEventListener("click", function () {
      var name = document.getElementById("newGroupName").value.trim();
      createGroup(name);
    });
    var saveUserGroupsBtn = document.getElementById("saveUserGroupsBtn");
    if (saveUserGroupsBtn) saveUserGroupsBtn.addEventListener("click", function () {
      var newMap = {};
      document.querySelectorAll("select[data-user]").forEach(function (sel) { newMap[sel.getAttribute("data-user")] = sel.value; });
      saveUserGroups(newMap);
    });
    var saveRoomGroupsBtn = document.getElementById("saveRoomGroupsBtn");
    if (saveRoomGroupsBtn) saveRoomGroupsBtn.addEventListener("click", function () {
      var newMap = {};
      document.querySelectorAll("select[data-room]").forEach(function (sel) { newMap[sel.getAttribute("data-room")] = sel.value; });
      saveRoomGroups(newMap);
    });
    var addRoomBtn = document.getElementById("addRoomBtn");
    if (addRoomBtn) addRoomBtn.addEventListener("click", function () {
      var number = document.getElementById("newRoomNumber").value.trim();
      var label = document.getElementById("newRoomLabel").value.trim();
      var groupId = document.getElementById("newRoomGroup").value;
      createRoom(number, label, groupId);
    });
    var addWsBtn = document.getElementById("addWsBtn");
    if (addWsBtn) addWsBtn.addEventListener("click", function () {
      var roomId = document.getElementById("newWsRoom").value;
      var label = document.getElementById("newWsLabel").value.trim();
      createWorkspace(roomId, label);
    });
    document.querySelectorAll("[data-user-action]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-user-id");
        var action = btn.getAttribute("data-user-action");
        var u = profileById(id);
        setUserStatus(id, action, u ? u.full_name : "diese Person");
      });
    });
    var saveAdminRightsBtn = document.getElementById("saveAdminRightsBtn");
    if (saveAdminRightsBtn) saveAdminRightsBtn.addEventListener("click", function () {
      var newMap = {};
      document.querySelectorAll("[data-admin-toggle]").forEach(function (cb) { newMap[cb.getAttribute("data-admin-toggle")] = cb.checked; });
      saveAdminRights(newMap);
    });
    var favSaveAll = document.getElementById("favSaveAll");
    if (favSaveAll) favSaveAll.addEventListener("click", function () {
      var wsVal = document.getElementById("favWs").value || null;
      var fromV = document.getElementById("favFrom").value, toV = document.getElementById("favTo").value;
      if ((fromV === "") !== (toV === "")) { showToast("Bitte Beginn und Ende der Lieblingszeit wählen – oder beide leer lassen."); return; }
      var fields = { favorite_workspace_id: wsVal };
      if (fromV === "") { fields.favorite_start = null; fields.favorite_end = null; }
      else {
        var fs = parseInt(fromV, 10), fe = parseInt(toV, 10);
        if (fe <= fs) { showToast("Das Ende muss nach dem Beginn liegen."); return; }
        if (fe - fs > MAX_DURATION) { showToast("Die Lieblingszeit darf höchstens 10,5 Stunden umfassen."); return; }
        fields.favorite_start = fmtMin(fs); fields.favorite_end = fmtMin(fe);
      }
      saveFavorites(fields, "Favoriten gespeichert.");
    });
    var favClearAll = document.getElementById("favClearAll");
    if (favClearAll) favClearAll.addEventListener("click", function () {
      saveFavorites({ favorite_workspace_id: null, favorite_start: null, favorite_end: null }, "Favoriten entfernt.");
    });
    var favBook = document.querySelector("[data-favbook]"), favOther = document.querySelector("[data-favother]");
    if (favBook || favOther) {
      var fw = myFavoriteWorkspace();
      if (favBook) favBook.addEventListener("click", function () { var t = myFavorite(); openBookingModal(fw.room, fw.ws, state.selectedDate, null, { start: t.start, end: t.end }); });
      if (favOther) favOther.addEventListener("click", function () { openBookingModal(fw.room, fw.ws, state.selectedDate, null); });
    }
    var runFreqBtn = document.getElementById("runFreqBtn");
    if (runFreqBtn) runFreqBtn.addEventListener("click", function () {
      runFrequencyReport(document.getElementById("freqFrom").value, document.getElementById("freqTo").value);
    });
    var runLogBtn = document.getElementById("runLogBtn");
    if (runLogBtn) runLogBtn.addEventListener("click", function () {
      runBookingLog(document.getElementById("logFrom").value, document.getElementById("logTo").value);
    });

    var backdrop = document.getElementById("modalBackdrop");
    if (backdrop) {
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeModal(); });
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("modalConfirm").addEventListener("click", function () {
        var m = state.modal;
        if (m && m.type === "cancel") { if (m.busy) return; m.busy = true; render(); cancelBooking(m.bookingId); }
        else confirmBooking();
      });
      document.querySelectorAll("[data-preset]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var p = presetsForMe().find(function (x) { return x.key === btn.getAttribute("data-preset"); });
          state.modal.start = p.start; state.modal.end = p.end; render();
        });
      });
      var favSave = document.getElementById("favSave");
      if (favSave) favSave.addEventListener("click", function () { saveFavorite(state.modal.start, state.modal.end); });
      var favRemove = document.getElementById("favRemove");
      if (favRemove) favRemove.addEventListener("click", function () { saveFavorite(null, null); });
      var selS = document.getElementById("slotStart"), selE = document.getElementById("slotEnd");
      if (selS) selS.addEventListener("change", function () {
        state.modal.start = parseInt(selS.value, 10);
        // Endzeit bleibt unverändert; nur wenn der Beginn nicht mehr davor liegt, Ende = Beginn + 1 Std.
        if (state.modal.end <= state.modal.start) state.modal.end = Math.min(DAY_END, state.modal.start + 60);
        render();
      });
      if (selE) selE.addEventListener("change", function () { state.modal.end = parseInt(selE.value, 10); render(); });
    }
  }

  // ---------- init ----------

  function init() {
    state.dates = buildWorkdays(WORKDAY_COUNT);
    state.selectedDate = fmtISO(state.dates[0]);
    render();

    // Gruppen werden bereits vor dem Login geladen, damit sie im Registrierungsformular auswählbar sind.
    loadGroups();

    supabaseClient.auth.getSession().then(function (res) {
      state.session = res.data.session;
      if (state.session) afterLogin(); else render();
    });

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      state.session = session;
      if (!session) { state.profile = null; render(); }
      else if (!state.profile) { afterLogin(); }
    });

    // Keeps the date strip current if the tab is left open across midnight:
    // whenever the tab regains focus, re-check whether "today" has moved on.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      var freshDates = buildWorkdays(WORKDAY_COUNT);
      var datesChanged = !state.dates.length || fmtISO(freshDates[0]) !== fmtISO(state.dates[0]);
      if (datesChanged) {
        state.dates = freshDates;
        state.selectedDate = fmtISO(freshDates[0]);
      }
      if (state.session && state.profile) {
        loadBookings();
        loadVacations();
      }
      if (datesChanged) render();
    });
  }

  init();
})();
</script>
</body>
</html>
