<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VAK Büro-Buchung</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --vak-blue: #0d3b66;
    --vak-blue-light: #14568f;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1c2733;
    --text-muted: #5c6b7a;
    --border: #e1e6ea;
    --free: #d9f2df;
    --free-border: #4caf7d;
    --free-text: #1e6b42;
    --busy: #fbdada;
    --busy-border: #d97676;
    --busy-text: #9c3b3b;
    --permanent: #fff3cf;
    --permanent-border: #e0b84a;
    --permanent-text: #8a6d1a;
    --locked: #e7e9ec;
    --locked-border: #c3c9d0;
    --locked-text: #6b7280;
    --name-accent: #0d3b66;
    --name-accent-bg: #eaf1f8;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --card-bg: #1b232b; --text: #eef1f4; --text-muted: #9aa7b4; --border: #2b3540;
      --free: #163826; --free-border: #3f9d6c; --free-text: #8fe0b3;
      --busy: #3a1f22; --busy-border: #b25b5b; --busy-text: #f0a9a9;
      --permanent: #3a2f10; --permanent-border: #c9a53a; --permanent-text: #f0d488;
      --locked: #232b33; --locked-border: #3a4552; --locked-text: #8b97a3;
      --name-accent: #8fc1ee; --name-accent-bg: #1f3348;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --card-bg: #1b232b; --text: #eef1f4; --text-muted: #9aa7b4; --border: #2b3540;
    --free: #163826; --free-border: #3f9d6c; --free-text: #8fe0b3;
    --busy: #3a1f22; --busy-border: #b25b5b; --busy-text: #f0a9a9;
    --permanent: #3a2f10; --permanent-border: #c9a53a; --permanent-text: #f0d488;
    --locked: #232b33; --locked-border: #3a4552; --locked-text: #8b97a3;
    --name-accent: #8fc1ee; --name-accent-bg: #1f3348;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  header.topbar {
    background: linear-gradient(135deg, var(--vak-blue) 0%, var(--vak-blue-light) 100%);
    color: #fff; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px; position: sticky; top: 0; z-index: 10;
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo-badge { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .brand-text { line-height: 1.15; }
  .brand-text .title { font-weight: 700; font-size: 15.5px; }
  .brand-text .subtitle { font-size: 11.5px; opacity: 0.85; }
  .user-chip { font-size: 12.5px; background: rgba(255,255,255,0.16); padding: 6px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px; white-space: nowrap; max-width: 46vw; overflow: hidden; }
  .user-chip span.uname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-chip button { background: none; border: none; color: #fff; opacity: 0.75; font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; flex-shrink: 0; }

  nav.tabs { display: flex; gap: 4px; margin-top: 14px; background: rgba(255,255,255,0.14); padding: 4px; border-radius: 12px; }
  nav.tabs button { flex: 1; border: none; background: transparent; color: #fff; opacity: 0.75; padding: 9px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  nav.tabs button.active { background: #fff; color: var(--vak-blue); opacity: 1; }

  main { flex: 1; padding: 16px 16px 90px; max-width: 640px; margin: 0 auto; width: 100%; }

  .date-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .date-chip { flex: 0 0 auto; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; cursor: pointer; text-align: center; min-width: 58px; }
  .date-chip .dow { display: block; font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; }
  .date-chip .dom { display: block; font-weight: 700; font-size: 15px; margin-top: 2px; }
  .date-chip.active { background: var(--vak-blue); border-color: var(--vak-blue); color: #fff; }
  .date-chip.active .dow { color: #cfe0ee; }

  .room-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .room-card h3 { margin: 0 0 2px; font-size: 15px; }
  .room-card .room-note { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; }
  .workspace-block { padding: 10px 0; border-top: 1px solid var(--border); }
  .workspace-block:first-child { border-top: none; padding-top: 0; }
  .ws-label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .ws-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .slot-btn { border-radius: 9px; padding: 9px 6px; font-size: 11.5px; font-weight: 600; border: 1.5px solid; cursor: pointer; text-align: center; line-height: 1.25; width: 100%; }
  .slot-btn.full-span { grid-column: 1 / -1; }
  .slot-btn.free { background: var(--free); border-color: var(--free-border); color: var(--free-text); }
  .slot-btn.busy { background: var(--busy); border-color: var(--busy-border); color: var(--busy-text); cursor: default; }
  .slot-btn.permanent { background: var(--permanent); border-color: var(--permanent-border); color: var(--permanent-text); cursor: default; }
  .slot-btn.locked { background: var(--locked); border-color: var(--locked-border); color: var(--locked-text); cursor: default; }
  .slot-btn.ownconflict { background: var(--locked); border-color: var(--locked-border); color: var(--locked-text); cursor: default; }
  .slot-btn small { display: block; font-weight: 400; font-size: 10px; opacity: 0.85; }
  .slot-btn .mini-cancel { display: block; margin: 4px auto 0; background: none; border: none; text-decoration: underline; font-size: 9.5px; font-weight: 700; color: var(--busy-text); cursor: pointer; padding: 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--text-muted); margin: 4px 0 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h3 { margin-top: 0; font-size: 15px; }

  .booking-item, .vacation-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  .booking-item:first-of-type, .vacation-item:first-of-type { border-top: none; }
  .booking-main { font-size: 13.5px; font-weight: 600; }
  .booking-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .btn-danger { border: none; background: var(--busy); color: var(--busy-text); border-radius: 8px; padding: 7px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .empty-state { color: var(--text-muted); font-size: 13px; text-align: center; padding: 26px 10px; }

  .btn-primary { background: var(--vak-blue); color: #fff; border: none; border-radius: 10px; padding: 11px 16px; font-size: 13.5px; font-weight: 700; cursor: pointer; width: 100%; }
  .btn-primary:disabled { opacity: 0.45; cursor: default; }
  .btn-link { background: none; border: none; color: var(--vak-blue-light); font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 4px 0; }
  select, input[type="date"], input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); font-size: 14px; margin-top: 6px;
  }
  label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }

  .login-wrap { padding: 40px 22px; max-width: 420px; margin: 0 auto; text-align: left; }
  .login-wrap .logo-big { width: 56px; height: 56px; border-radius: 16px; background: var(--vak-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 14px; }
  .login-wrap h2 { margin: 0 0 4px; font-size: 19px; color: var(--text); text-align: center; }
  .login-wrap p.intro { color: var(--text-muted); font-size: 13.5px; margin-top: 4px; text-align: center; }
  .auth-field { margin-bottom: 14px; }
  .auth-error { background: var(--busy); color: var(--busy-text); border-radius: 9px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 14px; }
  .auth-info { background: var(--free); color: var(--free-text); border-radius: 9px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 14px; }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 12.5px; color: var(--text-muted); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(10,15,20,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .modal { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); animation: slideUp 0.18s ease-out; }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h3 { margin-top: 0; font-size: 16px; }
  .modal .modal-sub { color: var(--text-muted); font-size: 12.5px; margin-bottom: 14px; }
  .confirm-summary { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 18px; }
  .confirm-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
  .confirm-row span { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .confirm-row b { font-weight: 700; text-align: right; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-secondary { flex: 1; background: var(--locked); color: var(--text); border: none; border-radius: 10px; padding: 11px; font-size: 13.5px; font-weight: 700; cursor: pointer; }

  footer.app-footer { text-align: center; padding: 18px; font-size: 11px; color: var(--text-muted); }
  footer.app-footer a { color: var(--text-muted); text-decoration: underline; cursor: pointer; }

  .toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--vak-blue); color: #fff; padding: 10px 18px; border-radius: 30px; font-size: 12.5px; font-weight: 600; z-index: 60; box-shadow: 0 6px 18px rgba(0,0,0,0.18); max-width: 90vw; text-align: center; }
  .banner { background: var(--permanent); border: 1px solid var(--permanent-border); color: var(--permanent-text); border-radius: 10px; padding: 10px 12px; font-size: 12px; margin-bottom: 14px; }
  .admin-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
  .admin-row:first-of-type { border-top: none; }
</style>
</head>
<body>
<div id="app"><div class="empty-state">Lädt…</div></div>

<script>
(function () {
  "use strict";

  // ---- Supabase project config (public/anon key — safe to expose client-side; access is enforced by RLS) ----
  var SUPABASE_URL = "https://iupkvjcaozhxjnrgfdpl.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cGt2amNhb3poeGpucmdmZHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMjUzNDgsImV4cCI6MjEwNTkwMTM0OH0.F_lpwECNNULZ9dSFn5Li4cTSHU5okdU_0_kzBIFTO2g";

  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var ROOMS = [
    { number: "210", label: "Raum 210", workspaces: [{ id: "210-1", label: "Platz 1" }] },
    { number: "211", label: "Raum 211", workspaces: [{ id: "211-1", label: "Platz 1" }] },
    { number: "212", label: "Raum 212", workspaces: [{ id: "212-1", label: "Platz 1 (links)" }, { id: "212-2", label: "Platz 2 (rechts)" }] },
    { number: "213", label: "Raum 213", workspaces: [{ id: "213-1", label: "Platz 1 (links)" }, { id: "213-2", label: "Platz 2 (rechts)" }] }
  ];

  var ALL_WORKSPACES = [];
  ROOMS.forEach(function (room) {
    room.workspaces.forEach(function (ws) {
      ALL_WORKSPACES.push({ workspaceId: ws.id, workspaceLabel: ws.label, roomNumber: room.number, roomLabel: room.label });
    });
  });

  var PART_LABEL = { AM: "Vormittag", PM: "Nachmittag", FULL: "Ganztags" };
  var PART_TIME = { AM: "bis 12:00", PM: "ab 12:00", FULL: "" };
  var WORKDAY_COUNT = 10;

  var state = {
    session: null,
    profile: null,          // own profile row { id, full_name, is_admin }
    profiles: [],           // all profiles, for name lookups + admin dropdown
    tab: "buchen",
    selectedDate: null,
    dates: [],
    bookings: [],
    vacations: [],
    permanentAssignments: {},   // workspace_id -> user_id
    modal: null,
    toastMsg: null,
    authMode: "login",      // 'login' | 'register'
    authError: null,
    authInfo: null,
    authBusy: false,
    loadingData: false
  };

  function profileById(id) { for (var i = 0; i < state.profiles.length; i++) if (state.profiles[i].id === id) return state.profiles[i]; return null; }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseISO(s) { var p = s.split("-"); return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)); }
  var DOW = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  var MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

  function buildWorkdays(count) {
    var out = []; var d = new Date(); d.setHours(0, 0, 0, 0);
    while (out.length < count) {
      var wd = d.getDay();
      if (wd !== 0 && wd !== 6) out.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showToast(msg) {
    state.toastMsg = msg; render();
    setTimeout(function () { state.toastMsg = null; render(); }, 2400);
  }

  // ---------- data access helpers ----------

  function bookingsForDate(dateISO) { return state.bookings.filter(function (b) { return b.booking_date === dateISO; }); }

  function slotStatus(workspaceId, dateISO, part) {
    var list = bookingsForDate(dateISO).filter(function (b) { return b.workspace_id === workspaceId; });
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (b.part === "FULL" || b.part === part) return { status: "busy", booking: b };
    }
    return { status: "free", booking: null };
  }

  // Finds a booking the current user already holds elsewhere that overlaps this date/part
  // (same overlap rule as the database trigger: FULL conflicts with everything).
  function myConflictingBooking(dateISO, part, excludeWorkspaceId) {
    if (!state.profile) return null;
    return state.bookings.find(function (b) {
      if (b.user_id !== state.profile.id) return false;
      if (b.booking_date !== dateISO) return false;
      if (b.workspace_id === excludeWorkspaceId) return false;
      return b.part === "FULL" || part === "FULL" || b.part === part;
    }) || null;
  }

  function partAvailability(ws, dateISO, part) {
    var s = slotStatus(ws.id, dateISO, part);
    if (s.status === "busy") {
      var owner = profileById(s.booking.user_id);
      return { kind: "busy", note: owner ? owner.full_name : "belegt" };
    }
    var conflict = myConflictingBooking(dateISO, part, ws.id);
    if (conflict) {
      var croom = ROOMS.find(function (r) { return r.number === conflict.room_number; });
      var cws = croom ? croom.workspaces.find(function (w) { return w.id === conflict.workspace_id; }) : null;
      var where = (croom ? croom.label : conflict.room_number) + (cws ? " · " + cws.label : "");
      return { kind: "own", note: where, conflictId: conflict.id };
    }
    return { kind: "free" };
  }

  function workspacePermState(workspaceId, dateISO) {
    var ownerId = state.permanentAssignments[workspaceId];
    if (!ownerId) return null;
    var onVacation = state.vacations.some(function (v) { return v.user_id === ownerId && v.vacation_date === dateISO; });
    return onVacation ? "released" : "locked";
  }

  // ---------- auth ----------

  function handleAuthSubmit(email, password, fullName) {
    state.authError = null; state.authInfo = null;
    if (!email || !password || (state.authMode === "register" && !fullName)) {
      state.authError = "Bitte alle Felder ausfüllen."; render(); return;
    }
    state.authBusy = true; render();

    if (state.authMode === "register") {
      supabaseClient.auth.signUp({
        email: email, password: password,
        options: { data: { full_name: fullName } }
      }).then(function (res) {
        state.authBusy = false;
        if (res.error) { state.authError = translateAuthError(res.error.message); render(); return; }
        if (res.data.session) {
          state.session = res.data.session;
          afterLogin();
        } else {
          state.authMode = "login";
          state.authInfo = "Konto angelegt. Bitte bestätige deine E-Mail-Adresse (falls gefordert) und melde dich dann an.";
          render();
        }
      }).catch(function (e) { state.authBusy = false; state.authError = "Registrierung fehlgeschlagen."; render(); console.error(e); });
    } else {
      supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
        state.authBusy = false;
        if (res.error) { state.authError = translateAuthError(res.error.message); render(); return; }
        state.session = res.data.session;
        afterLogin();
      }).catch(function (e) { state.authBusy = false; state.authError = "Anmeldung fehlgeschlagen."; render(); console.error(e); });
    }
  }

  function translateAuthError(msg) {
    if (!msg) return "Unbekannter Fehler.";
    if (/invalid login credentials/i.test(msg)) return "E-Mail oder Passwort ist falsch.";
    if (/already registered|already exists/i.test(msg)) return "Für diese E-Mail existiert bereits ein Konto.";
    if (/password.*(least|6|characters)/i.test(msg)) return "Das Passwort muss mindestens 6 Zeichen haben.";
    if (/email.*confirm/i.test(msg)) return "Bitte bestätige zuerst deine E-Mail-Adresse.";
    return msg;
  }

  function signOut() {
    supabaseClient.auth.signOut().then(function () {
      state.session = null; state.profile = null; state.tab = "buchen"; render();
    });
  }

  function afterLogin() {
    loadAllData(true);
  }

  // ---------- booking actions ----------

  function openBookingModal(room, workspace, dateISO, part) {
    state.modal = { type: "book", room: room, workspace: workspace, dateISO: dateISO, part: part };
    render();
  }
  function closeModal() { state.modal = null; render(); }

  function confirmBooking() {
    var m = state.modal;
    if (!m) return;
    supabaseClient.from("bookings").insert({
      user_id: state.profile.id, room_number: m.room.number, workspace_id: m.workspace.id,
      booking_date: m.dateISO, part: m.part
    }).then(function (res) {
      if (res.error) {
        var msg = /andere Buchung/i.test(res.error.message)
          ? "Für diesen Zeitraum besteht bereits eine andere Buchung von dir. Bitte zuerst stornieren."
          : "Buchung fehlgeschlagen: " + res.error.message;
        showToast(msg);
        console.error(res.error);
        closeModal();
        loadBookings();
        return;
      }
      showToast("Gebucht: " + m.room.label + " · " + m.workspace.label);
      closeModal();
      loadBookings();
    });
  }

  function cancelBooking(id) {
    supabaseClient.from("bookings").delete().eq("id", id).then(function (res) {
      if (res.error) { showToast("Stornieren fehlgeschlagen."); console.error(res.error); return; }
      showToast("Buchung storniert."); loadBookings();
    });
  }

  function weekdaysBetween(startISO, endISO) {
    var out = [];
    var d = parseISO(startISO);
    var end = parseISO(endISO);
    while (d <= end) {
      var wd = d.getDay();
      if (wd !== 0 && wd !== 6) out.push(fmtISO(d));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  function addVacationRange(startISO, endISO) {
    var allDates = weekdaysBetween(startISO, endISO);
    if (!allDates.length) { showToast("Der Zeitraum enthält keine Werktage."); return; }
    var existing = state.vacations.filter(function (v) { return v.user_id === state.profile.id; }).map(function (v) { return v.vacation_date; });
    var toInsert = allDates.filter(function (d) { return existing.indexOf(d) === -1; }).map(function (d) { return { user_id: state.profile.id, vacation_date: d }; });
    if (!toInsert.length) { showToast("Dieser Zeitraum ist bereits vollständig eingetragen."); return; }
    supabaseClient.from("vacations").insert(toInsert).then(function (res) {
      if (res.error) { showToast("Eintragen fehlgeschlagen: " + res.error.message); console.error(res.error); return; }
      showToast(toInsert.length + " Urlaubstag(e) eingetragen.");
      loadVacations();
    });
  }

  function removeVacation(id) {
    supabaseClient.from("vacations").delete().eq("id", id).then(function (res) {
      if (res.error) { showToast("Entfernen fehlgeschlagen."); console.error(res.error); return; }
      loadVacations();
    });
  }

  function savePermanentAssignments(newMap) {
    var toUpsert = [];
    var toDeleteWs = [];
    ALL_WORKSPACES.forEach(function (w) {
      var newVal = newMap[w.workspaceId] || null;
      var oldVal = state.permanentAssignments[w.workspaceId] || null;
      if (newVal === oldVal) return;
      if (newVal) toUpsert.push({ workspace_id: w.workspaceId, user_id: newVal });
      else toDeleteWs.push(w.workspaceId);
    });
    var ops = [];
    if (toUpsert.length) ops.push(supabaseClient.from("permanent_assignments").upsert(toUpsert, { onConflict: "workspace_id" }));
    if (toDeleteWs.length) ops.push(supabaseClient.from("permanent_assignments").delete().in("workspace_id", toDeleteWs));
    if (!ops.length) { showToast("Keine Änderungen."); return; }
    Promise.all(ops).then(function (results) {
      var errored = results.filter(function (r) { return r.error; });
      if (errored.length) { showToast("Speichern fehlgeschlagen: " + errored[0].error.message); console.error(errored[0].error); return; }
      showToast("Gespeichert."); loadPermanentAssignments();
    });
  }

  // ---------- data loading ----------

  function loadProfiles() {
    return supabaseClient.from("profiles").select("id, full_name, is_admin").then(function (res) {
      if (!res.error) state.profiles = res.data || [];
    });
  }
  function loadBookings() {
    return supabaseClient.from("bookings").select("id, user_id, room_number, workspace_id, booking_date, part")
      .gte("booking_date", fmtISO(new Date(Date.now() - 86400000)))
      .then(function (res) { if (!res.error) state.bookings = res.data || []; render(); });
  }
  function loadVacations() {
    return supabaseClient.from("vacations").select("id, user_id, vacation_date").then(function (res) {
      if (!res.error) state.vacations = res.data || []; render();
    });
  }
  function loadPermanentAssignments() {
    return supabaseClient.from("permanent_assignments").select("workspace_id, user_id").then(function (res) {
      var map = {};
      if (!res.error) (res.data || []).forEach(function (row) { map[row.workspace_id] = row.user_id; });
      state.permanentAssignments = map;
      render();
    });
  }

  function loadAllData(afterAuth) {
    state.loadingData = true;
    render();
    Promise.all([loadProfiles(), loadBookings(), loadVacations(), loadPermanentAssignments()]).then(function () {
      state.profile = profileById(state.session.user.id);
      if (!state.profile) {
        // profile row may not exist yet (trigger race right after signup) — retry once shortly
        setTimeout(function () {
          loadProfiles().then(function () {
            state.profile = profileById(state.session.user.id);
            state.loadingData = false;
            render();
          });
        }, 1200);
      } else {
        state.loadingData = false;
        render();
      }
    });
  }

  // ---------- rendering ----------

  function render() {
    var app = document.getElementById("app");
    if (!state.session) { app.innerHTML = renderLogin(); bindLogin(); return; }
    if (state.loadingData && !state.profile) { app.innerHTML = '<div class="empty-state">Lädt…</div>'; return; }
    app.innerHTML = renderShell();
    bindShell();
  }

  function renderLogin() {
    var isRegister = state.authMode === "register";
    var html = '<div class="login-wrap">';
    html += '<div class="logo-big">🏢</div>';
    html += '<h2>VAK Büro-Buchung</h2>';
    html += '<p class="intro">' + (isRegister ? "Neues Konto anlegen" : "Bitte anmelden, um deinen Büroarbeitsplatz zu buchen.") + '</p>';
    if (state.authError) html += '<div class="auth-error">' + escapeHtml(state.authError) + '</div>';
    if (state.authInfo) html += '<div class="auth-info">' + escapeHtml(state.authInfo) + '</div>';
    html += '<form id="authForm">';
    if (isRegister) {
      html += '<div class="auth-field"><label for="fullName">Name</label><input type="text" id="fullName" autocomplete="name" placeholder="Vorname Nachname"></div>';
    }
    html += '<div class="auth-field"><label for="authEmail">E-Mail</label><input type="email" id="authEmail" autocomplete="email" placeholder="name@beispiel.de"></div>';
    html += '<div class="auth-field"><label for="authPassword">Passwort</label><input type="password" id="authPassword" autocomplete="' + (isRegister ? "new-password" : "current-password") + '" placeholder="mind. 6 Zeichen"></div>';
    html += '<button type="submit" class="btn-primary"' + (state.authBusy ? " disabled" : "") + '>' + (state.authBusy ? "Bitte warten…" : (isRegister ? "Konto erstellen" : "Anmelden")) + '</button>';
    html += '</form>';
    html += '<div class="auth-switch">';
    html += isRegister ? 'Schon registriert? <button class="btn-link" id="switchAuth">Zur Anmeldung</button>' : 'Noch kein Konto? <button class="btn-link" id="switchAuth">Konto erstellen</button>';
    html += '</div></div>';
    return html;
  }

  function bindLogin() {
    var form = document.getElementById("authForm");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("authEmail").value.trim();
      var password = document.getElementById("authPassword").value;
      var fullNameEl = document.getElementById("fullName");
      var fullName = fullNameEl ? fullNameEl.value.trim() : null;
      handleAuthSubmit(email, password, fullName);
    });
    document.getElementById("switchAuth").addEventListener("click", function () {
      state.authMode = state.authMode === "register" ? "login" : "register";
      state.authError = null; state.authInfo = null;
      render();
    });
  }

  function renderShell() {
    var user = state.profile;
    var html = '<header class="topbar">';
    html += '<div class="topbar-row">';
    html += '<div class="brand"><div class="logo-badge">🏢</div><div class="brand-text"><div class="title">Büro-Buchung</div><div class="subtitle">VAK Schleswig-Holstein</div></div></div>';
    html += '<div class="user-chip"><span class="uname">' + escapeHtml(user ? user.full_name : "") + '</span><button id="logoutBtn">abmelden</button></div>';
    html += '</div>';
    html += '<nav class="tabs">';
    html += '<button data-tab="buchen" class="' + (state.tab === "buchen" ? "active" : "") + '">Buchen</button>';
    html += '<button data-tab="meine" class="' + (state.tab === "meine" ? "active" : "") + '">Meine</button>';
    html += '<button data-tab="urlaub" class="' + (state.tab === "urlaub" ? "active" : "") + '">Urlaub</button>';
    html += '<button data-tab="uebersicht" class="' + (state.tab === "uebersicht" ? "active" : "") + '">Übersicht</button>';
    html += '</nav></header>';
    html += '<main>';
    if (state.tab === "buchen") html += renderBuchen();
    else if (state.tab === "meine") html += renderMeine();
    else if (state.tab === "urlaub") html += renderUrlaub();
    else if (state.tab === "uebersicht") html += renderUebersicht();
    else if (state.tab === "admin") html += renderAdmin();
    html += '</main>';
    html += '<footer class="app-footer"><a id="adminLink">Systemverwaltung</a></footer>';
    if (state.modal) html += renderModal();
    if (state.toastMsg) html += '<div class="toast">' + escapeHtml(state.toastMsg) + '</div>';
    return html;
  }

  function renderDateScroll() {
    var html = '<div class="date-scroll">';
    state.dates.forEach(function (d) {
      var iso = fmtISO(d); var active = iso === state.selectedDate;
      html += '<div class="date-chip ' + (active ? "active" : "") + '" data-date="' + iso + '">';
      html += '<span class="dow">' + DOW[d.getDay()] + '</span><span class="dom">' + d.getDate() + '.' + MONTHS[d.getMonth()] + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  function partButtonHtml(room, ws, part, avail) {
    if (avail.kind === "free") {
      var timeNote = PART_TIME[part] ? '<small>' + PART_TIME[part] + '</small>' : '';
      return '<button class="slot-btn free" data-room="' + room.number + '" data-ws="' + ws.id + '" data-part="' + part + '">' + PART_LABEL[part] + timeNote + '</button>';
    }
    if (avail.kind === "own") {
      var html = '<div class="slot-btn ownconflict">' + PART_LABEL[part] + '<small>eigene Buchung: ' + escapeHtml(avail.note) + '</small>';
      html += '<button type="button" class="mini-cancel" data-cancel-inline="' + avail.conflictId + '">zuerst stornieren</button></div>';
      return html;
    }
    return '<div class="slot-btn busy">' + PART_LABEL[part] + '<small>' + escapeHtml(avail.note || "belegt") + '</small></div>';
  }

  function renderBuchen() {
    var html = renderDateScroll();
    var dateISO = state.selectedDate;
    html += '<div class="legend"><span><i style="background:var(--free-border)"></i>frei</span><span><i style="background:var(--busy-border)"></i>belegt</span><span><i style="background:var(--permanent-border)"></i>dauerhaft belegt</span></div>';

    ROOMS.forEach(function (room) {
      html += '<div class="room-card"><h3>' + escapeHtml(room.label) + '</h3>';
      room.workspaces.forEach(function (ws) {
        var permState = workspacePermState(ws.id, dateISO);
        html += '<div class="workspace-block"><div class="ws-label">' + escapeHtml(ws.label) + '</div><div class="ws-slots">';
        if (permState === "locked") {
          var owner = profileById(state.permanentAssignments[ws.id]);
          html += '<div class="slot-btn permanent full-span">Dauerhaft belegt<small>' + escapeHtml(owner ? owner.full_name : "?") + '</small></div>';
        } else {
          var amAvail = partAvailability(ws, dateISO, "AM");
          var pmAvail = partAvailability(ws, dateISO, "PM");
          var fullAvail = partAvailability(ws, dateISO, "FULL");
          // Someone else holding AM or PM here always makes FULL impossible — this must win
          // even if the base FULL check already resolved to "own" (a conflict elsewhere),
          // because cancelling that own booking would not free up this workspace.
          if (amAvail.kind === "busy" || pmAvail.kind === "busy") {
            fullAvail = { kind: "busy", note: "nicht verfügbar" };
          } else if (fullAvail.kind === "free" && (amAvail.kind === "own" || pmAvail.kind === "own")) {
            fullAvail = amAvail.kind === "own" ? amAvail : pmAvail;
          }
          html += partButtonHtml(room, ws, "AM", amAvail);
          html += partButtonHtml(room, ws, "PM", pmAvail);
          html += partButtonHtml(room, ws, "FULL", fullAvail);
        }
        html += '</div>';
        if (permState === "released") {
          var owner3 = profileById(state.permanentAssignments[ws.id]);
          html += '<div class="room-note">' + escapeHtml(owner3 ? owner3.full_name : "Stammnutzer:in") + ' hat heute Urlaub – Platz ist buchbar.</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });
    return html;
  }

  function renderMeine() {
    var mine = state.bookings.filter(function (b) { return b.user_id === state.profile.id; }).sort(function (a, b) { return a.booking_date.localeCompare(b.booking_date); });
    var html = '<div class="card"><h3>Meine Buchungen</h3>';
    if (!mine.length) { html += '<div class="empty-state">Noch keine Buchungen vorhanden.</div>'; }
    else {
      mine.forEach(function (b) {
        var room = ROOMS.find(function (r) { return r.number === b.room_number; });
        var ws = room ? room.workspaces.find(function (w) { return w.id === b.workspace_id; }) : null;
        var d = parseISO(b.booking_date);
        html += '<div class="booking-item"><div><div class="booking-main">' + (room ? escapeHtml(room.label) : b.room_number) + (ws ? " · " + escapeHtml(ws.label) : "") + '</div>';
        html += '<div class="booking-sub">' + DOW[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + ' · ' + PART_LABEL[b.part] + '</div></div>';
        html += '<button class="btn-danger" data-cancel="' + b.id + '">Stornieren</button></div>';
      });
    }
    html += '</div>';
    return html;
  }

  function renderUrlaub() {
    var myWorkspaceIds = Object.keys(state.permanentAssignments).filter(function (wsId) { return state.permanentAssignments[wsId] === state.profile.id; });

    if (!myWorkspaceIds.length) {
      var html0 = '<div class="card"><h3>Urlaub</h3>';
      html0 += '<div class="empty-state">Die Urlaubseintragung ist nur für Kolleg:innen mit einem dauerhaft zugewiesenen Arbeitsplatz relevant (weil dieser Platz sonst blockiert bleibt). Dir ist aktuell kein fester Platz zugewiesen – du buchst einfach direkt an den Tagen, an denen du ins Büro kommst. Ein Eintrag hier ist für dich nicht nötig.</div></div>';
      return html0;
    }

    var myLabels = myWorkspaceIds.map(function (wsId) {
      var w = ALL_WORKSPACES.find(function (x) { return x.workspaceId === wsId; });
      return w ? (w.roomLabel + " · " + w.workspaceLabel) : wsId;
    }).join(", ");

    var mine = state.vacations.filter(function (v) { return v.user_id === state.profile.id; }).sort(function (a, b) { return a.vacation_date.localeCompare(b.vacation_date); });
    var html = '<div class="card"><h3>Urlaub eintragen</h3>';
    html += '<div class="banner">Dir ist ' + escapeHtml(myLabels) + ' dauerhaft zugewiesen. An deinen Urlaubstagen wird der Platz automatisch für andere buchbar.</div>';
    html += '<label for="vacStart">Von</label><input type="date" id="vacStart" min="' + fmtISO(new Date()) + '">';
    html += '<label for="vacEnd">Bis</label><input type="date" id="vacEnd" min="' + fmtISO(new Date()) + '">';
    html += '<div class="booking-sub" style="margin-top:8px">Es werden nur Werktage (Mo–Fr) im gewählten Zeitraum eingetragen, Wochenenden automatisch übersprungen.</div>';
    html += '<div style="height:10px"></div><button class="btn-primary" id="addVacBtn">Urlaubszeitraum eintragen</button></div>';
    html += '<div class="card"><h3>Meine Urlaubstage</h3>';
    if (!mine.length) { html += '<div class="empty-state">Keine Einträge vorhanden.</div>'; }
    else {
      mine.forEach(function (v) {
        var d = parseISO(v.vacation_date);
        html += '<div class="vacation-item"><div class="booking-main">' + DOW[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + '</div>';
        html += '<button class="btn-danger" data-rmvac="' + v.id + '">Entfernen</button></div>';
      });
    }
    html += '</div>';
    return html;
  }

  function renderAdmin() {
    var html = '<div class="card"><h3>Systemverwaltung</h3>';
    html += '<div class="modal-sub">Feste Arbeitsplätze für Kolleg:innen ohne Home-Office festlegen. Ein zugewiesener Platz ist normalerweise gesperrt und wird nur an den Urlaubstagen der zugewiesenen Person für andere buchbar.</div>';
    ALL_WORKSPACES.forEach(function (w) {
      html += '<label for="perm-' + w.workspaceId + '">' + escapeHtml(w.roomLabel) + ' · ' + escapeHtml(w.workspaceLabel) + '</label>';
      html += '<select id="perm-' + w.workspaceId + '" data-ws="' + w.workspaceId + '"><option value="">– kein Dauernutzer –</option>';
      state.profiles.forEach(function (u) {
        var sel = state.permanentAssignments[w.workspaceId] === u.id ? " selected" : "";
        html += '<option value="' + u.id + '"' + sel + '>' + escapeHtml(u.full_name) + '</option>';
      });
      html += '</select>';
    });
    html += '<div style="height:10px"></div><button class="btn-primary" id="savePermBtn">Speichern</button></div>';

    if (!state.profile || !state.profile.is_admin) {
      html += '<div class="empty-state">Hinweis: Änderungen hier werden nur übernommen, wenn dein Konto als Administrator markiert ist.</div>';
    }
    html += '<div class="empty-state">Eine Gesamtübersicht aller Buchungen und Urlaubstage findest du im Tab „Übersicht".</div>';
    return html;
  }

  function renderUebersicht() {
    var html = '<div class="card"><h3>Team-Übersicht</h3><div class="modal-sub">Alle Buchungen und Urlaubstage der nächsten ' + WORKDAY_COUNT + ' Arbeitstage.</div></div>';
    state.dates.forEach(function (d) {
      var iso = fmtISO(d);
      var dayBookings = state.bookings.filter(function (b) { return b.booking_date === iso; })
        .sort(function (a, b) { return a.room_number.localeCompare(b.room_number) || a.workspace_id.localeCompare(b.workspace_id); });
      var dayVacations = state.vacations.filter(function (v) { return v.vacation_date === iso; });
      html += '<div class="card"><h3>' + DOW[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + '</h3>';
      if (!dayBookings.length && !dayVacations.length) {
        html += '<div class="empty-state">Keine Einträge.</div>';
      } else {
        dayBookings.forEach(function (b) {
          var room = ROOMS.find(function (r) { return r.number === b.room_number; });
          var ws = room ? room.workspaces.find(function (w) { return w.id === b.workspace_id; }) : null;
          var owner = profileById(b.user_id);
          html += '<div class="admin-row"><span>' + (room ? escapeHtml(room.label) : b.room_number) + (ws ? ' · ' + escapeHtml(ws.label) : '') + ' · ' + PART_LABEL[b.part] + '</span><span>' + escapeHtml(owner ? owner.full_name : "?") + '</span></div>';
        });
        if (dayVacations.length) {
          var names = dayVacations.map(function (v) { var o = profileById(v.user_id); return escapeHtml(o ? o.full_name : "?"); }).join(", ");
          html += '<div class="room-note" style="margin-top:8px">Urlaub: ' + names + '</div>';
        }
      }
      html += '</div>';
    });
    return html;
  }

  function renderModal() {
    var m = state.modal; if (!m || m.type !== "book") return "";
    var html = '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">';
    html += '<h3>Buchung bestätigen</h3>';
    var d = parseISO(m.dateISO);
    var timeNote = { AM: "bis 12:00 Uhr", PM: "ab 12:00 Uhr", FULL: "" }[m.part];
    html += '<div class="confirm-summary">';
    html += '<div class="confirm-row"><span>Arbeitsplatz</span><b>' + escapeHtml(m.room.label) + ' · ' + escapeHtml(m.workspace.label) + '</b></div>';
    html += '<div class="confirm-row"><span>Datum</span><b>' + DOW[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()] + '</b></div>';
    html += '<div class="confirm-row"><span>Zeitraum</span><b>' + PART_LABEL[m.part] + (timeNote ? ' (' + timeNote + ')' : '') + '</b></div>';
    html += '</div>';
    html += '<div class="modal-actions"><button class="btn-secondary" id="modalCancel">Abbrechen</button>';
    html += '<button class="btn-primary" id="modalConfirm">Jetzt buchen</button></div></div></div>';
    return html;
  }

  function bindShell() {
    document.getElementById("logoutBtn").addEventListener("click", signOut);
    document.querySelectorAll("nav.tabs button").forEach(function (btn) {
      btn.addEventListener("click", function () { state.tab = btn.getAttribute("data-tab"); render(); });
    });
    document.getElementById("adminLink").addEventListener("click", function () { state.tab = "admin"; render(); });

    document.querySelectorAll(".date-chip").forEach(function (chip) {
      chip.addEventListener("click", function () { state.selectedDate = chip.getAttribute("data-date"); render(); });
    });
    document.querySelectorAll(".slot-btn.free").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var room = ROOMS.find(function (r) { return r.number === btn.getAttribute("data-room"); });
        var ws = room.workspaces.find(function (w) { return w.id === btn.getAttribute("data-ws"); });
        openBookingModal(room, ws, state.selectedDate, btn.getAttribute("data-part"));
      });
    });
    document.querySelectorAll("[data-cancel]").forEach(function (btn) { btn.addEventListener("click", function () { cancelBooking(btn.getAttribute("data-cancel")); }); });
    document.querySelectorAll("[data-cancel-inline]").forEach(function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); cancelBooking(btn.getAttribute("data-cancel-inline")); });
    });
    document.querySelectorAll("[data-rmvac]").forEach(function (btn) { btn.addEventListener("click", function () { removeVacation(btn.getAttribute("data-rmvac")); }); });

    var addVacBtn = document.getElementById("addVacBtn");
    if (addVacBtn) addVacBtn.addEventListener("click", function () {
      var startVal = document.getElementById("vacStart").value;
      var endVal = document.getElementById("vacEnd").value;
      if (!startVal || !endVal) { showToast("Bitte Start- und Enddatum wählen."); return; }
      if (endVal < startVal) { showToast("Das Enddatum muss nach dem Startdatum liegen."); return; }
      addVacationRange(startVal, endVal);
    });
    var savePermBtn = document.getElementById("savePermBtn");
    if (savePermBtn) savePermBtn.addEventListener("click", function () {
      var newMap = {};
      document.querySelectorAll("select[data-ws]").forEach(function (sel) { newMap[sel.getAttribute("data-ws")] = sel.value; });
      savePermanentAssignments(newMap);
    });

    var backdrop = document.getElementById("modalBackdrop");
    if (backdrop) {
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeModal(); });
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("modalConfirm").addEventListener("click", confirmBooking);
    }
  }

  // ---------- init ----------

  function init() {
    state.dates = buildWorkdays(WORKDAY_COUNT);
    state.selectedDate = fmtISO(state.dates[0]);
    render();

    supabaseClient.auth.getSession().then(function (res) {
      state.session = res.data.session;
      if (state.session) afterLogin(); else render();
    });

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      state.session = session;
      if (!session) { state.profile = null; render(); }
    });

    // Keeps the date strip current if the tab is left open across midnight:
    // whenever the tab regains focus, re-check whether "today" has moved on.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      var freshDates = buildWorkdays(WORKDAY_COUNT);
      var datesChanged = !state.dates.length || fmtISO(freshDates[0]) !== fmtISO(state.dates[0]);
      if (datesChanged) {
        state.dates = freshDates;
        state.selectedDate = fmtISO(freshDates[0]);
      }
      if (state.session && state.profile) {
        loadBookings();
        loadVacations();
      }
      if (datesChanged) render();
    });
  }

  init();
})();
</script>
</body>
</html>
