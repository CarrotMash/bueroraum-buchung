<style>
  :root {
    /* Offizielle VAK-Farben (vak-sh.de): Primärblau #00528C, dunkles Blau #003F69, Akzentrot #B70C23 */
    --vak-blue: #00528c;
    --vak-blue-dark: #003f69;
    --vak-blue-light: #1f7fb8;
    --vak-red: #b70c23;
    --bg: #f2f6f9;
    --card-bg: #ffffff;
    --text: #1c2733;
    --text-muted: #5c6b7a;
    --border: #e1e6ea;
    --free: #d9f2df;
    --free-border: #4caf7d;
    --free-text: #1e6b42;
    --busy: #fbe6e9;
    --busy-border: #d67e8a;
    --busy-text: #b70c23;
    --permanent: #fff3cf;
    --permanent-border: #e0b84a;
    --permanent-text: #8a6d1a;
    --locked: #e7e9ec;
    --locked-border: #c3c9d0;
    --locked-text: #6b7280;
    --name-accent: #00528c;
    --name-accent-bg: #eaf1f8;
    --vak-blue-deep: #002a4a;
    --shadow: 0 1px 2px rgba(0,40,70,.05), 0 4px 14px rgba(0,40,70,.06);
    --shadow-hover: 0 2px 4px rgba(0,40,70,.06), 0 14px 32px rgba(0,40,70,.13);
    --radius: 16px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --card-bg: #1b232b; --text: #eef1f4; --text-muted: #9aa7b4; --border: #2b3540;
      --free: #163826; --free-border: #3f9d6c; --free-text: #8fe0b3;
      --busy: #3a1f22; --busy-border: #b25b5b; --busy-text: #f0a9a9;
      --permanent: #3a2f10; --permanent-border: #c9a53a; --permanent-text: #f0d488;
      --locked: #232b33; --locked-border: #3a4552; --locked-text: #8b97a3;
      --name-accent: #8fc1ee; --name-accent-bg: #1f3348;
      --shadow: none; --shadow-hover: 0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --card-bg: #1b232b; --text: #eef1f4; --text-muted: #9aa7b4; --border: #2b3540;
    --free: #163826; --free-border: #3f9d6c; --free-text: #8fe0b3;
    --busy: #3a1f22; --busy-border: #b25b5b; --busy-text: #f0a9a9;
    --permanent: #3a2f10; --permanent-border: #c9a53a; --permanent-text: #f0d488;
    --locked: #232b33; --locked-border: #3a4552; --locked-text: #8b97a3;
    --name-accent: #8fc1ee; --name-accent-bg: #1f3348;
    --shadow: none; --shadow-hover: 0 10px 30px rgba(0,0,0,.4);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  header.topbar {
    background: var(--card-bg); position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo-badge { width: 38px; height: 38px; border-radius: 9px; background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 4px; flex-shrink: 0; }
  .brand .logo-badge img { width: 100%; height: 100%; object-fit: contain; }
  .brand .sep { width: 4px; height: 26px; background: var(--vak-red); border-radius: 2px; flex-shrink: 0; }
  .brand-text { line-height: 1.15; }
  .brand-text .title { font-weight: 700; font-size: 15.5px; color: var(--text); }
  .brand-text .subtitle { font-size: 11.5px; color: var(--text-muted); }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .theme-btn { border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 11px; font-weight: 600; border-radius: 20px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  .brand-text .title, .brand-text .subtitle { white-space: nowrap; }
  @media (max-width: 460px) {
    .theme-btn { padding: 6px 9px; }
    .top-row .theme-btn .theme-label { display: none; }
    .top-row { padding-left: 14px; padding-right: 14px; }
    .brand { gap: 8px; }
  }
  .brand-text .sub-short { display: none; }
  /* Wenig Platz: Kurzbezeichnung "VAK SH" statt "VAK Schleswig-Holstein" */
  @media (max-width: 560px) {
    .brand-text .sub-long { display: none; }
    .brand-text .sub-short { display: inline; }
    .user-chip span.uname { display: none; }
    .user-chip { padding: 4px 10px 4px 4px; }
  }
  @media (max-width: 360px) { .brand .sep { display: none; } .brand .logo-badge { width: 34px; height: 34px; } }
  .brand, .top-right { min-width: 0; }
  .brand-text { min-width: 0; }
  .top-right { flex-shrink: 1; }
  .brand { flex-shrink: 0; }
  .user-chip { font-size: 12.5px; background: var(--name-accent-bg); color: var(--name-accent); padding: 6px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px; white-space: nowrap; max-width: 40vw; overflow: hidden; }
  .user-chip .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--vak-blue); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: -4px; }
  :root[data-theme="dark"] .user-chip .avatar { background: #2f6ea3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .user-chip .avatar { background: #2f6ea3; } }
  .user-chip span.uname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-chip button { background: none; border: none; color: var(--name-accent); opacity: 0.75; font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; flex-shrink: 0; }

  .tabs-band { background: linear-gradient(135deg, var(--vak-blue) 0%, var(--vak-blue-dark) 100%); padding: 10px 18px; }
  nav.tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.14); padding: 4px; border-radius: 12px; }
  nav.tabs button { flex: 1; border: none; background: transparent; color: #fff; opacity: 0.75; padding: 9px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  nav.tabs button.active { background: #fff; color: var(--vak-blue); opacity: 1; }

  main { flex: 1; padding: 16px 16px 90px; max-width: 640px; margin: 0 auto; width: 100%; }

  .date-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .date-chip { flex: 0 0 auto; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; cursor: pointer; text-align: center; min-width: 58px; transition: transform .12s, box-shadow .12s; }
  .date-chip:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .date-chip .dow { display: block; font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; }
  .date-chip .dom { display: block; font-weight: 700; font-size: 15px; margin-top: 2px; }
  .date-chip.active { background: var(--vak-blue); border-color: var(--vak-blue); color: #fff; }
  .date-chip.active .dow { color: #cfe0ee; }

  .room-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); transition: box-shadow .15s; }
  .room-card:hover { box-shadow: var(--shadow-hover); }
  .room-card h3 { margin: 0 0 2px; font-size: 15px; }
  .room-card .room-note { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; }
  .workspace-block { padding: 10px 0; border-top: 1px solid var(--border); }
  .workspace-block:first-child { border-top: none; padding-top: 0; }
  .ws-label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .ws-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .timeline { margin: 2px 0 6px; }
  .tl-track { position: relative; height: 26px; border-radius: 8px; overflow: hidden; background: var(--free); border: 1px solid var(--free-border);
    background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(100% / 15 - 1px), rgba(0,0,0,.07) calc(100% / 15 - 1px), rgba(0,0,0,.07) calc(100% / 15)); }
  .tl-track.tl-click { cursor: pointer; }
  .tl-seg { position: absolute; top: 0; bottom: 0; }
  .tl-seg.busy { background: var(--busy-border); }
  .tl-seg.mine { background: var(--vak-blue); }
  .tl-seg.past { background: repeating-linear-gradient(45deg, var(--locked) 0 4px, var(--locked-border) 4px 6px); opacity: .85; }
  .tl-seg.sel { background: rgba(31,127,184,.25); border: 2px solid var(--vak-blue-light); border-radius: 6px; }
  .tl-seg.sel.bad { background: rgba(183,12,35,.18); border-color: var(--vak-red); }
  .tl-scale { position: relative; height: 13px; margin-top: 2px; font-size: 9.5px; color: var(--text-muted); }
  .tl-scale span { position: absolute; transform: translateX(-50%); }
  .tl-scale span:last-child { transform: translateX(-100%); }
  .ws-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0 3px 8px; border-left: 3px solid var(--busy-border); margin: 3px 0; }
  .ws-line.mine { border-left-color: var(--vak-blue); }
  .line-actions { display: inline-flex; gap: 10px; flex-shrink: 0; }
  .ws-line .mini-edit { margin: 0; background: none; border: none; padding: 0; text-decoration: underline; font-size: 11px; font-weight: 700; color: var(--name-accent); cursor: pointer; }
  .booking-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-edit { border: none; background: var(--name-accent-bg); color: var(--name-accent); border-radius: 8px; padding: 7px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .ws-line .mini-cancel { margin: 0; background: none; border: none; padding: 0; text-decoration: underline; font-size: 11px; font-weight: 700; color: var(--busy-text); cursor: pointer; flex-shrink: 0; }
  .ws-free { font-size: 11.5px; color: var(--free-text); margin: 4px 0 8px; }
  .preset-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 6px; margin: 6px 0 12px; }
  .preset-chip.fav { border-color: var(--permanent-border); }
  .preset-chip.fav.active { border-color: var(--vak-blue); }
  .fav-line { font-size: 12px; color: var(--text-muted); margin: -2px 0 10px; }
  .fav-line .link-btn { background: none; border: none; padding: 0; color: var(--name-accent); font-weight: 700; font-size: 12px; text-decoration: underline; cursor: pointer; }
  .fav-card h3 { margin-bottom: 6px; }
  .fav-quick { border-color: var(--permanent-border); }
  .fq-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--permanent-text); }
  .fq-place { font-size: 15px; font-weight: 700; margin: 2px 0 6px; }
  .fq-note { font-size: 12.5px; margin-bottom: 10px; }
  .fq-note.ok { color: var(--free-text); }
  .fq-note.bad { color: var(--busy-text); }
  .fq-actions { display: flex; gap: 8px; }
  .fq-actions .btn-primary { flex: 2; }
  .fq-actions .btn-secondary { flex: 1; }
  .fav-star { color: var(--permanent-border); }
  .preset-chip { border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text); border-radius: 10px; padding: 7px 4px; font-size: 12px; font-weight: 700; cursor: pointer; line-height: 1.2; }
  .preset-chip small { display: block; font-weight: 400; font-size: 10.5px; color: var(--text-muted); }
  .preset-chip.active { border-color: var(--vak-blue); background: var(--name-accent-bg); color: var(--name-accent); }
  .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .duration-note { font-size: 12.5px; color: var(--text); margin: 4px 0 10px; }
  .duration-note span { color: var(--text-muted); }
  .slot-errors { background: var(--busy); color: var(--busy-text); border-radius: 9px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 12px; }
  .slot-errors div + div { margin-top: 4px; }
  .slot-btn { border-radius: 9px; padding: 9px 6px; font-size: 11.5px; font-weight: 600; border: 1.5px solid; cursor: pointer; text-align: center; line-height: 1.25; width: 100%; transition: transform .12s, box-shadow .12s; }
  .slot-btn.full-span { grid-column: 1 / -1; }
  .slot-btn.free { background: var(--free); border-color: var(--free-border); color: var(--free-text); }
  .slot-btn.free:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .slot-btn.busy { background: var(--busy); border-color: var(--busy-border); color: var(--busy-text); cursor: default; }
  .slot-btn.permanent { background: var(--permanent); border-color: var(--permanent-border); color: var(--permanent-text); cursor: default; }
  .slot-btn.locked { background: var(--locked); border-color: var(--locked-border); color: var(--locked-text); cursor: default; }
  .slot-btn.ownconflict { background: var(--locked); border-color: var(--locked-border); color: var(--locked-text); cursor: default; }
  .slot-btn small { display: block; font-weight: 400; font-size: 10px; opacity: 0.85; }
  .slot-btn .mini-cancel { display: block; margin: 4px auto 0; background: none; border: none; text-decoration: underline; font-size: 9.5px; font-weight: 700; color: var(--busy-text); cursor: pointer; padding: 0; }

  .group-heading { display: inline-block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #fff; background: var(--vak-blue); padding: 5px 12px; border-radius: 20px; margin: 0 0 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--text-muted); margin: 4px 0 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h3 { margin-top: 0; font-size: 15px; }

  .booking-item, .vacation-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  .booking-item:first-of-type, .vacation-item:first-of-type { border-top: none; }
  .booking-main { font-size: 13.5px; font-weight: 600; }
  .booking-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .btn-danger { border: none; background: var(--busy); color: var(--busy-text); border-radius: 8px; padding: 7px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .empty-state { color: var(--text-muted); font-size: 13px; text-align: center; padding: 26px 10px; }

  .btn-primary { background: var(--vak-blue); color: #fff; border: none; border-radius: 10px; padding: 11px 16px; font-size: 13.5px; font-weight: 700; cursor: pointer; width: 100%; }
  .btn-danger-solid { background: var(--vak-red); }
  .btn-primary:disabled { opacity: 0.45; cursor: default; }
  .btn-link { background: none; border: none; color: var(--vak-blue-light); font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 4px 0; }
  select, input[type="date"], input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); font-size: 14px; margin-top: 6px;
  }
  label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }

  .login-wrap { padding: 20px 22px 40px; max-width: 420px; margin: 0 auto; text-align: left; }
  .login-top-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .login-illustration .scene-day, .login-illustration .scene-night { transition: opacity .5s ease; }
  .login-illustration .scene-night { opacity: 0; }
  :root[data-theme="dark"] .login-illustration .scene-night { opacity: 1; }
  :root[data-theme="dark"] .login-illustration .scene-day { opacity: 0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .login-illustration .scene-night { opacity: 1; }
    :root:not([data-theme="light"]) .login-illustration .scene-day { opacity: 0; }
  }
  .login-illustration { width: 100%; max-width: 270px; height: auto; display: block; margin: 0 auto 6px; }
  .login-wrap .logo-big { width: 120px; height: auto; display: block; margin: 0 auto 16px; }
  .login-wrap .logo-big img { width: 100%; height: auto; display: block; border-radius: 8px; }
  /* Dunkelmodus: Logo auf weißem, abgerundetem Chip – analog VAK-Toolportal */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login-wrap .logo-big img { background: #fff; padding: 6px 10px; border-radius: 10px; } }
  :root[data-theme="dark"] .login-wrap .logo-big img { background: #fff; padding: 6px 10px; border-radius: 10px; }
  .login-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 20px; }
  .login-wrap h2 { margin: 0 0 4px; font-size: 19px; color: var(--text); text-align: center; }
  .login-wrap p.intro { color: var(--text-muted); font-size: 13.5px; margin-top: 4px; text-align: center; }
  .auth-field { margin-bottom: 14px; }
  .date-pick { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .date-pick input { flex: 1; margin-top: 6px; }
  .cal-btn { margin-top: 6px; border: 1px solid var(--border); background: var(--card-bg); border-radius: 9px; padding: 8px 11px; font-size: 16px; cursor: pointer; }
  .cal-btn.open { border-color: var(--vak-blue); background: var(--name-accent-bg); }
  .vcal { border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin: 0 0 12px; background: var(--card-bg); box-shadow: var(--shadow); }
  .vcal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  .vcal-nav { border: none; background: var(--bg); color: var(--text); border-radius: 8px; width: 34px; height: 30px; font-size: 18px; cursor: pointer; }
  .vcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .vcal-dow { font-size: 10.5px; color: var(--text-muted); font-weight: 600; padding-bottom: 2px; }
  .vcal-day { border: none; background: var(--bg); color: var(--text); border-radius: 8px; padding: 8px 0; font-size: 13px; cursor: pointer; }
  .vcal-day.we { color: var(--text-muted); background: transparent; }
  .vcal-day.today { box-shadow: inset 0 0 0 1.5px var(--vak-blue-light); }
  .vcal-day.vac { background: var(--permanent); color: var(--permanent-text); }
  .vcal-day.inrange { background: var(--name-accent-bg); color: var(--name-accent); }
  .vcal-day.sel { background: var(--vak-blue); color: #fff; font-weight: 700; }
  .vcal-day:disabled { opacity: .3; cursor: default; }
  .vcal-foot { display: flex; gap: 14px; font-size: 10.5px; color: var(--text-muted); margin-top: 8px; }
  .vcal-foot .lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .vcal-foot .lg.vac { background: var(--permanent); border: 1px solid var(--permanent-border); }
  .vcal-foot .lg.we { border: 1px solid var(--border); }
  .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .auth-error { background: var(--busy); color: var(--busy-text); border-radius: 9px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 14px; }
  .auth-info { background: var(--free); color: var(--free-text); border-radius: 9px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 14px; }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 12.5px; color: var(--text-muted); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(10,15,20,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .modal { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); animation: slideUp 0.18s ease-out; }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal { max-height: 92vh; overflow-y: auto; }
  .modal h3 { margin-top: 0; font-size: 16px; }
  .modal .modal-sub { color: var(--text-muted); font-size: 12.5px; margin-bottom: 14px; }
  .confirm-summary { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 18px; }
  .confirm-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
  .confirm-row span { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .confirm-row b { font-weight: 700; text-align: right; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-secondary { flex: 1; background: var(--locked); color: var(--text); border: none; border-radius: 10px; padding: 11px; font-size: 13.5px; font-weight: 700; cursor: pointer; }

  footer.app-footer { text-align: center; padding: 18px; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border); background: var(--card-bg); }
  footer.app-footer a { color: var(--text-muted); text-decoration: underline; cursor: pointer; }

  .toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--vak-blue); color: #fff; padding: 10px 18px; border-radius: 30px; font-size: 12.5px; font-weight: 600; z-index: 60; box-shadow: 0 6px 18px rgba(0,0,0,0.18); max-width: 90vw; text-align: center; }
  .banner { background: var(--permanent); border: 1px solid var(--permanent-border); color: var(--permanent-text); border-radius: 10px; padding: 10px 12px; font-size: 12px; margin-bottom: 14px; }
  .admin-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
  .admin-row:first-of-type { border-top: none; }

  // Theme-Umschaltung (Hell/Dunkel), analog zum VAK-Toolportal-Muster.
  function sysDarkTheme() { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
  function isDarkTheme() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : sysDarkTheme(); }
  function applyThemeButtonLabel() {
    var dark = isDarkTheme();
    var icon = dark ? "\u2600\uFE0F" : "\uD83C\uDF19";
    var text = dark ? "Hell" : "Dunkel";
    document.querySelectorAll(".theme-btn").forEach(function (b) {
      b.innerHTML = '<span aria-hidden="true">' + icon + '</span><span class="theme-label"> ' + text + '</span>';
      b.setAttribute("title", dark ? "Zum hellen Modus wechseln" : "Zum dunklen Modus wechseln");
      b.setAttribute("aria-label", dark ? "Zum hellen Modus wechseln" : "Zum dunklen Modus wechseln");
    });
  }
  function toggleTheme() {
    var next = isDarkTheme() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("vakBuchung.theme", next); } catch (e) {}
    applyThemeButtonLabel();
  }

  // Räume, Arbeitsplätze und Gruppen kommen jetzt aus der Datenbank (state.groups/state.rooms/state.workspaces),
  // damit Admins künftig weitere Räume/Gruppen selbst anlegen können, statt sie im Code zu pflegen.
  // Diese Helfer bauen daraus dieselbe Struktur, die der bisherige Code erwartet hat ({number,label,workspaces:[{id,label}]}).

  function allRoomsWithWorkspaces() {
    return state.rooms.slice().sort(function (a, b) { return a.sort_order - b.sort_order; }).map(function (r) {
      var wss = state.workspaces.filter(function (w) { return w.room_id === r.id; })
        .sort(function (a, b) { return a.sort_order - b.sort_order; });
      return {
        number: r.number, label: r.label, groupId: r.group_id,
        workspaces: wss.map(function (w) { return { id: w.id, label: w.label }; })
      };
    });
  }
  function roomsForGroup(groupId) {
    return allRoomsWithWorkspaces().filter(function (r) { return r.groupId === groupId; });
  }
  function findRoomByNumber(roomNumber) {
    return allRoomsWithWorkspaces().find(function (r) { return r.number === roomNumber; }) || null;
  }
  function allWorkspacesFlat() {
    var out = [];
    allRoomsWithWorkspaces().forEach(function (room) {
      room.workspaces.forEach(function (ws) {
        out.push({ workspaceId: ws.id, workspaceLabel: ws.label, roomNumber: room.number, roomLabel: room.label, groupId: room.groupId });
      });
    });
    return out;
  }
  function groupById(id) { return state.groups.find(function (g) { return g.id === id; }) || null; }

  // Zeitspannen-Buchung: 30-Minuten-Raster zwischen 05:00 und 20:00 Uhr, höchstens 10,5 Stunden.
  var DAY_START = 5 * 60, DAY_END = 20 * 60, STEP_MIN = 30, MAX_DURATION = 10 * 60 + 30;
  var PRESETS = [
    { key: "AM", label: "Vormittag", start: 8 * 60, end: 12 * 60 },
    { key: "PM", label: "Nachmittag", start: 12 * 60, end: 16 * 60 },
    { key: "FULL", label: "Ganztags", start: 8 * 60, end: 16 * 60 }
  ];
  // Persönliche Lieblingszeit (in den Profildaten gespeichert)
  // Wer einen festen Arbeitsplatz hat, braucht (und bekommt) keine Favoriten
  function hasPermanentDesk() {
    return !!state.profile && Object.keys(state.permanentAssignments).some(function (wsId) { return state.permanentAssignments[wsId] === state.profile.id; });
  }
  function myFavorite() {
    if (hasPermanentDesk()) return null;
    var pr = state.profile;
    if (!pr || !pr.favorite_start || !pr.favorite_end) return null;
    return { key: "FAV", label: "Mein Favorit", start: toMin(pr.favorite_start), end: toMin(pr.favorite_end), fav: true };
  }
  function presetsForMe() {
    var f = myFavorite();
    return f ? [f].concat(PRESETS) : PRESETS;
  }
  // Lieblingsplatz (nur Plätze der eigenen Gruppe)
  function myFavoriteWorkspace() {
    if (hasPermanentDesk()) return null;
    var pr = state.profile;
    if (!pr || !pr.favorite_workspace_id) return null;
    var hit = null;
    roomsForGroup(pr.group_id).forEach(function (room) {
      room.workspaces.forEach(function (ws) { if (ws.id === pr.favorite_workspace_id) hit = { room: room, ws: ws }; });
    });
    return hit;
  }
  // Speichert Favoriten-Felder im eigenen Profil (fields: favorite_start/_end/_workspace_id)
  function saveFavorites(fields, okMsg) {
    supabaseClient.from("profiles").update(fields).eq("id", state.profile.id).select("id").then(function (res) {
      if (res.error || !res.data || !res.data.length) {
        showToast("Favorit konnte nicht gespeichert werden.");
        if (res.error) console.error(res.error);
        return;
      }
      [state.profile, profileById(state.profile.id)].forEach(function (pr) {
        if (!pr) return;
        Object.keys(fields).forEach(function (k) {
          var v = fields[k];
          pr[k] = (v && (k === "favorite_start" || k === "favorite_end")) ? v + ":00" : v;
        });
      });
      showToast(okMsg);
    });
  }
  function saveFavorite(start, end) {
    if (start == null) saveFavorites({ favorite_start: null, favorite_end: null }, "Lieblingszeit entfernt.");
    else saveFavorites({ favorite_start: fmtMin(start), favorite_end: fmtMin(end) }, "Lieblingszeit gespeichert: " + rangeLabel(start, end));
  }

  // Nur noch für alte Protokolleinträge ohne Uhrzeit
  // Bereich "Auswertungen" (Buchungshäufigkeit, Buchungsprotokoll) aus Datenschutzgründen und
  // mit Blick auf die Mitbestimmung des Personalrats deaktiviert. Wieder einschalten: true setzen
  // UND die Lese-Berechtigung auf booking_log in der Datenbank wiederherstellen (siehe supabase/).
  var REPORTS_ENABLED = false;
  var LEGACY_PART_LABEL = { AM: "Vormittag", PM: "Nachmittag", FULL: "Ganztags" };
  var WORKDAY_COUNT = 10;

  var state = {
    session: null,
    profile: null,          // own profile row { id, full_name, is_admin, group_id }
    profiles: [],           // all profiles, for name lookups + admin dropdown
    groups: [],              // { id, name }
    rooms: [],                // { id, number, label, group_id, sort_order }
    workspaces: [],           // { id, room_id, label, sort_order }
    tab: "buchen",
    selectedDate: null,
    dates: [],
    bookings: [],
    vacations: [],
    permanentAssignments: {},   // workspace_id -> user_id
    modal: null,
    toastMsg: null,

    }
  };

  function profileById(id) { for (var i = 0; i < state.profiles.length; i++) if (state.profiles[i].id === id) return state.profiles[i]; return null; }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseISO(s) { var p = s.split("-"); return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)); }
  var DOW = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  var MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

  function buildWorkdays(count) {
    var out = []; var d = new Date(); d.setHours(0, 0, 0, 0);
    while (out.length < count) {
      var wd = d.getDay();
      if (wd !== 0 && wd !== 6) out.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showToast(msg) {
    state.toastMsg = msg; render();
    setTimeout(function () { state.toastMsg = null; render(); }, 2400);
  }

  // ---------- data access helpers ----------

  function bookingsForDate(dateISO) { return state.bookings.filter(function (b) { return b.booking_date === dateISO; }); }

  function toMin(t) { var p = String(t || "0:0").split(":"); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
  function fmtMin(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
  function bStart(b) { return toMin(b.start_time); }
  function bEnd(b) { return toMin(b.end_time); }
  function rangeLabel(s, e) { return fmtMin(s) + "–" + fmtMin(e) + " Uhr"; }
  function bookingTimeLabel(b) { return b.start_time ? rangeLabel(bStart(b), bEnd(b)) : (LEGACY_PART_LABEL[b.part] || ""); }
  function durationLabel(mins) { var h = mins / 60; return String(h).replace(".", ",") + " Std."; }
  function overlaps(aS, aE, bS, bE) { return aS < bE && bS < aE; }
  function byStart(a, b) { return bStart(a) - bStart(b); }

  function workspaceBookings(wsId, dateISO) {
    return bookingsForDate(dateISO).filter(function (b) { return b.workspace_id === wsId; }).sort(byStart);
  }
  function myBookingsOn(dateISO) {
    if (!state.profile) return [];
    return bookingsForDate(dateISO).filter(function (b) { return b.user_id === state.profile.id; }).sort(byStart);
  }
  // Bei "heute": aktuelle Uhrzeit in Minuten, sonst null
  function nowMinIfToday(dateISO) {
    var n = new Date();
    return dateISO === fmtISO(n) ? n.getHours() * 60 + n.getMinutes() : null;
  }
  function workspaceLabelFor(b) {
    var room = findRoomByNumber(b.room_number);
    var ws = room ? room.workspaces.find(function (w) { return w.id === b.workspace_id; }) : null;
    return (room ? room.label : b.room_number) + (ws ? " · " + ws.label : "");
  }

  // Freie Zeitfenster eines Platzes (bei "heute" erst ab der aktuellen halben Stunde)
  function freeIntervals(wsId, dateISO) {
    var now = nowMinIfToday(dateISO);
    var from = DAY_START;
    if (now !== null) from = Math.max(from, Math.floor(now / STEP_MIN) * STEP_MIN);
    var out = [];
    workspaceBookings(wsId, dateISO).forEach(function (b) {
      if (bStart(b) > from) out.push([from, Math.min(bStart(b), DAY_END)]);
      from = Math.max(from, bEnd(b));
    });
    if (from < DAY_END) out.push([from, DAY_END]);
    return out.filter(function (iv) { return iv[1] - iv[0] >= STEP_MIN; });
  }

  // Prüft einen Wunschzeitraum gegen alle Regeln; liefert Liste verständlicher Hinweise
  function validateSlot(wsId, dateISO, s, e, excludeId) {
    var errs = [];
    if (!(e > s)) errs.push("Das Ende muss nach dem Beginn liegen.");
    if (s < DAY_START || e > DAY_END) errs.push("Buchbar ist der Zeitraum von 05:00 bis 20:00 Uhr.");
    if (e - s > MAX_DURATION) errs.push("Eine Buchung darf höchstens 10,5 Stunden umfassen.");
    var now = nowMinIfToday(dateISO);
    if (now !== null && e <= now) errs.push("Dieser Zeitraum liegt bereits in der Vergangenheit.");
    if (e > s) {
      workspaceBookings(wsId, dateISO).forEach(function (b) {
        if (b.id === excludeId || !overlaps(s, e, bStart(b), bEnd(b))) return;
        var mine = state.profile && b.user_id === state.profile.id;
        var owner = profileById(b.user_id);
        errs.push("Platz ist " + rangeLabel(bStart(b), bEnd(b)) + " belegt" + (mine ? " (deine Buchung)" : (owner ? " (" + owner.full_name + ")" : "")) + ".");
      });
      myBookingsOn(dateISO).forEach(function (b) {
        if (b.id === excludeId || b.workspace_id === wsId || !overlaps(s, e, bStart(b), bEnd(b))) return;
        errs.push("Du hast " + rangeLabel(bStart(b), bEnd(b)) + " bereits " + workspaceLabelFor(b) + " gebucht.");
      });
    }
    return errs;
  }

  // Vorschlag für den Buchungsdialog: erste passende Schnellauswahl, sonst erstes freies Fenster
  function suggestSlot(wsId, dateISO, preferStart) {
    if (preferStart != null) {
      var iv = freeIntervals(wsId, dateISO).find(function (x) { return preferStart >= x[0] && preferStart < x[1]; });
      if (iv) return { start: preferStart, end: Math.min(iv[1], preferStart + 4 * 60) };
    }
    var fav = myFavorite();
    if (fav && !validateSlot(wsId, dateISO, fav.start, fav.end).length) return { start: fav.start, end: fav.end };
    var p = PRESETS.slice().reverse().find(function (x) { return !validateSlot(wsId, dateISO, x.start, x.end).length; });
    if (p) return { start: p.start, end: p.end };
    // Sonst: freies Fenster (ohne eigene Buchungen auf anderen Plätzen) mit dem größten Anteil an der Kernzeit 08–16 Uhr
    var mine = myBookingsOn(dateISO).filter(function (b) { return b.workspace_id !== wsId; });
    var cands = [];
    freeIntervals(wsId, dateISO).forEach(function (iv) {
      var parts = [iv];
      mine.forEach(function (b) {
        var next = [];
        parts.forEach(function (x) {
          if (!overlaps(x[0], x[1], bStart(b), bEnd(b))) { next.push(x); return; }
          if (bStart(b) > x[0]) next.push([x[0], bStart(b)]);
          if (bEnd(b) < x[1]) next.push([bEnd(b), x[1]]);
        });
        parts = next;
      });
      parts.forEach(function (x) { if (x[1] - x[0] >= STEP_MIN) cands.push(x); });
    });
    if (!cands.length) return null;
    function core(x) { return Math.max(0, Math.min(x[1], 16 * 60) - Math.max(x[0], 8 * 60)); }
    cands.sort(function (a, b) { return core(b) - core(a) || (b[1] - b[0]) - (a[1] - a[0]); });
    var best = cands[0];
    var start = core(best) > 0 ? Math.max(best[0], 8 * 60) : best[0];
    return { start: start, end: Math.min(best[1], start + 4 * 60) };
  }

  function workspacePermState(workspaceId, dateISO) {
    var ownerId = state.permanentAssignments[workspaceId];
    if (!ownerId) return null;
    var onVacation = state.vacations.some(function (v) { return v.user_id === ownerId && v.vacation_date === dateISO; });
    return onVacation ? "released" : "locked";
  }

  // ---------- auth ----------

  // Gleiche Vorgaben wie in Supabase eingestellt: mind. 8 Zeichen, Klein-/Großbuchstabe, Zahl, Sonderzeichen
  function passwordProblems(pw) {
    var miss = [];
    if (pw.length < 8) miss.push("mindestens 8 Zeichen");
    if (!/[a-zäöüß]/.test(pw)) miss.push("einen Kleinbuchstaben");
    if (!/[A-ZÄÖÜ]/.test(pw)) miss.push("einen Großbuchstaben");
    if (!/[0-9]/.test(pw)) miss.push("eine Zahl");
    if (!/[^A-Za-z0-9äöüÄÖÜß]/.test(pw)) miss.push("ein Sonderzeichen");
    return miss;
  }
  function clearPasswordAndFocus() { state.authDraft.password = ""; state.authFocus = "authPassword"; }

  function handleAuthSubmit(email, password, fullName, groupId) {
    state.authError = null; state.authInfo = null;
    if (!email || !password || (state.authMode === "register" && (!fullName || !groupId))) {
      state.authError = state.authMode === "register" ? "Bitte Vorname, Nachname, Gruppe, E-Mail und Passwort ausfüllen." : "Bitte E-Mail und Passwort eingeben.";
      render(); return;
    }
    if (state.authMode === "register") {
      var miss = passwordProblems(password);
      if (miss.length) {
        state.authError = "Das Passwort braucht noch: " + miss.join(", ") + ".";
        clearPasswordAndFocus(); render(); return;
      }
    }
    state.authBusy = true; render();

    if (state.authMode === "register") {
      supabaseClient.auth.signUp({
        email: email, password: password,
        // Nach Klick auf den Bestätigungslink zurück genau auf diese App-Seite leiten
        // (nicht auf die Domain-Wurzel, dort gibt es keine Seite → 404)
        options: { data: { full_name: fullName, group_id: groupId }, emailRedirectTo: window.location.origin + window.location.pathname }
      }).then(function (res) {
        state.authBusy = false;
        if (res.error) {
          state.authError = translateAuthError(res.error.message);
          if (/password/i.test(res.error.message)) clearPasswordAndFocus();
          render(); return;
        }
        state.authDraft.password = "";
        if (res.data.session) {
          state.session = res.data.session;
          afterLogin();
        } else {
          state.authMode = "login";
          state.authInfo = "Konto angelegt. Bitte bestätige deine E-Mail-Adresse (falls gefordert) und melde dich dann an.";
          render();
        }
      }).catch(function (e) { state.authBusy = false; state.authError = "Registrierung fehlgeschlagen."; render(); console.error(e); });
    } else {
      supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
        state.authBusy = false;
        if (res.error) { state.authError = translateAuthError(res.error.message); clearPasswordAndFocus(); render(); return; }
        state.authDraft = { firstName: "", lastName: "", groupId: "", email: "", password: "" };
        state.session = res.data.session;
        afterLogin();
      }).catch(function (e) { state.authBusy = false; state.authError = "Anmeldung fehlgeschlagen."; render(); console.error(e); });
    }
  }

  function translateAuthError(msg) {
    if (!msg) return "Unbekannter Fehler.";
    if (/invalid login credentials/i.test(msg)) return "E-Mail oder Passwort ist falsch.";
    if (/already registered|already exists/i.test(msg)) return "Für diese E-Mail existiert bereits ein Konto.";
    if (/password.*(least|characters|weak|lowercase|uppercase|digit|symbol)/i.test(msg)) return "Das Passwort erfüllt nicht die Anforderungen: mindestens 8 Zeichen, mit Klein- und Großbuchstaben, einer Zahl und einem Sonderzeichen.";
    if (/email.*confirm/i.test(msg)) return "Bitte bestätige zuerst deine E-Mail-Adresse.";
    return msg;
  }

  function signOut() {
    supabaseClient.auth.signOut().then(function () {
      state.session = null; state.profile = null; state.tab = "buchen"; render();
    });
  }

  function afterLogin() {
    loadAllData(true);
  }

  // ---------- booking actions ----------

  function openBookingModal(room, workspace, dateISO, preferStart, fixed) {
    var sug = fixed || suggestSlot(workspace.id, dateISO, preferStart);
    if (!sug) { showToast("Dieser Platz ist an diesem Tag nicht mehr frei."); return; }
    state.modal = { type: "book", room: room, workspace: workspace, dateISO: dateISO, start: sug.start, end: sug.end, busy: false };
    render();
  }
  // Eigene Buchung anpassen: nur Beginn und Ende (Platz und Tag bleiben)
  function openEditModal(bookingId) {
    var b = state.bookings.find(function (x) { return x.id === bookingId; });
    if (!b) return;
    var room = findRoomByNumber(b.room_number);
    var ws = room ? room.workspaces.find(function (w) { return w.id === b.workspace_id; }) : null;
    if (!room || !ws) { showToast("Arbeitsplatz nicht gefunden."); return; }
    state.modal = { type: "book", mode: "edit", bookingId: b.id, room: room, workspace: ws, dateISO: b.booking_date,
      start: bStart(b), end: bEnd(b), origStart: bStart(b), origEnd: bEnd(b), busy: false };
    render();
  }
  // Anpassen nur, solange die Buchung nicht vorbei ist
  function canEditBooking(b) {
    var today = fmtISO(new Date());
    if (b.booking_date < today) return false;
    var now = nowMinIfToday(b.booking_date);
    return now === null || bEnd(b) > now;
  }
  function modalErrors(m) {
    var errs = validateSlot(m.workspace.id, m.dateISO, m.start, m.end, m.mode === "edit" ? m.bookingId : null);
    return errs;
  }
  function closeModal() { state.modal = null; render(); }

  function confirmBooking() {
    var m = state.modal;
    if (!m) return;
    if (modalErrors(m).length || m.busy) return;
    if (m.mode === "edit") { saveBookingChange(m); return; }
    m.busy = true; render();
    supabaseClient.from("bookings").insert({
      user_id: state.profile.id, room_number: m.room.number, workspace_id: m.workspace.id,
      booking_date: m.dateISO, start_time: fmtMin(m.start), end_time: fmtMin(m.end)
    }).then(function (res) {
      if (res.error) {
        // Dialog offen lassen und aktuelle Belegung nachladen, damit ein anderer Zeitraum gewählt werden kann
        m.busy = false;
        showToast(translateBookingError(res.error));
        console.error(res.error);
        loadBookings();
        return;
      }
      showToast("Gebucht: " + m.room.label + " · " + m.workspace.label + ", " + rangeLabel(m.start, m.end));
      closeModal();
      loadBookings();
    });
  }

  function saveBookingChange(m) {
    if (m.start === m.origStart && m.end === m.origEnd) { closeModal(); return; }
    m.busy = true; render();
    supabaseClient.from("bookings").update({ start_time: fmtMin(m.start), end_time: fmtMin(m.end) })
      .eq("id", m.bookingId).select("id")
      .then(function (res) {
        m.busy = false;
        if (res.error || !res.data || !res.data.length) {
          showToast(res.error ? translateBookingError(res.error) : "Anpassen nicht möglich – bitte Seite neu laden.");
          if (res.error) console.error(res.error);
          loadBookings();
          return;
        }
        showToast("Angepasst: " + m.room.label + " · " + m.workspace.label + ", " + rangeLabel(m.start, m.end));
        closeModal();
        loadBookings();
      });
  }

  function translateBookingError(err) {
    var msg = (err && err.message) || "";
    if (/no_workspace_overlap/.test(msg)) return "Der Platz wurde soeben für einen Teil dieses Zeitraums gebucht. Bitte einen anderen Zeitraum wählen.";
    if (/no_user_overlap/.test(msg)) return "Du hast in diesem Zeitraum bereits eine andere Buchung.";
    if (/max_duration/.test(msg)) return "Eine Buchung darf höchstens 10,5 Stunden umfassen.";
    if (/time_frame/.test(msg)) return "Buchbar ist der Zeitraum von 05:00 bis 20:00 Uhr.";
    if (/time_grid/.test(msg)) return "Bitte Uhrzeiten im 30-Minuten-Raster wählen.";
    if (/[äöüÄÖÜß]| Uhr|Buchung|Arbeitsplatz/.test(msg)) return msg; // deutsche Meldung aus der Datenbank
    return "Buchung fehlgeschlagen: " + msg;
  }

  function askCancelBooking(id) {
    var b = state.bookings.find(function (x) { return x.id === id; });
    if (!b) return;
    state.modal = { type: "cancel", bookingId: id, booking: b, busy: false };

  function cancelBooking(id) {
    supabaseClient.from("bookings").delete().eq("id", id).then(function (res) {
      if (state.modal && state.modal.type === "cancel") state.modal = null;
      if (res.error) { showToast("Stornieren fehlgeschlagen."); console.error(res.error); return; }
      showToast("Buchung storniert."); loadBookings();
    });

  function weekdaysBetween(startISO, endISO) {
    var out = [];
    var d = parseISO(startISO);
    var end = parseISO(endISO);
    while (d <= end) {
      var wd = d.getDay();
      if (wd !== 0 && wd !== 6) out.push(fmtISO(d));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  function addVacationRange(startISO, endISO) {
    var allDates = weekdaysBetween(startISO, endISO);
    if (!allDates.length) { showToast("Der Zeitraum enthält keine Werktage."); return; }
    var existing = state.vacations.filter(function (v) { return v.user_id === state.profile.id; }).map(function (v) { return v.vacation_date; });
    var toInsert = allDates.filter(function (d) { return existing.indexOf(d) === -1; }).map(function (d) { return { user_id: state.profile.id, vacation_date: d }; });
    if (!toInsert.length) { showToast("Dieser Zeitraum ist bereits vollständig eingetragen."); return; }
    supabaseClient.from("vacations").insert(toInsert).then(function (res) {
      if (res.error) { showToast("Eintragen fehlgeschlagen: " + res.error.message); console.error(res.error); return; }
      state.vacForm = { start: "", end: "", open: null, calMonth: "" };
      showToast(toInsert.length + " Urlaubstag(e) eingetragen.");
      loadVacations();
    });
  }

  function removeVacation(id) {
    supabaseClient.from("vacations").delete().eq("id", id).then(function (res) {
      if (res.error) { showToast("Entfernen fehlgeschlagen."); console.error(res.error); return; }
      loadVacations();
    });
  }

  function savePermanentAssignments(newMap) {
    var toUpsert = [];
    var toDeleteWs = [];
    allWorkspacesFlat().forEach(function (w) {
      var newVal = newMap[w.workspaceId] || null;
      var oldVal = state.permanentAssignments[w.workspaceId] || null;
      if (newVal === oldVal) return;
      if (newVal) toUpsert.push({ workspace_id: w.workspaceId, user_id: newVal });
      else toDeleteWs.push(w.workspaceId);
    });
    var ops = [];
    if (toUpsert.length) ops.push(supabaseClient.from("permanent_assignments").upsert(toUpsert, { onConflict: "workspace_id" }));
    if (toDeleteWs.length) ops.push(supabaseClient.from("permanent_assignments").delete().in("workspace_id", toDeleteWs));
    if (!ops.length) { showToast("Keine Änderungen."); return; }
    Promise.all(ops).then(function (results) {
      var errored = results.filter(function (r) { return r.error; });
      if (errored.length) { showToast("Speichern fehlgeschlagen: " + errored[0].error.message); console.error(errored[0].error); return; }
      showToast("Gespeichert."); loadPermanentAssignments();
    });
  }

      deactivate: 'Konto von "' + fullName + '" deaktivieren? Login und Buchen werden gesperrt, die bisherige Historie bleibt erhalten. Kann jederzeit rückgängig gemacht werden.',

  // ---------- Auswertungen (nur Admin) ----------

  function runFrequencyReport(fromISO, toISO) {
    if (!fromISO || !toISO) { showToast("Bitte Zeitraum wählen."); return; }
    if (toISO < fromISO) { showToast("Das Enddatum muss nach dem Startdatum liegen."); return; }
    state.report.freqFrom = fromISO; state.report.freqTo = toISO;
    state.report.freqLoading = true; state.report.freqRows = null; render();
    supabaseClient.from("bookings").select("room_number, start_time, end_time")
      .gte("booking_date", fromISO).lte("booking_date", toISO)
      .then(function (res) {
        state.report.freqLoading = false;
        if (res.error) { showToast("Laden fehlgeschlagen: " + res.error.message); console.error(res.error); render(); return; }
        var counts = {}, minutes = {};
        (res.data || []).forEach(function (b) {
          counts[b.room_number] = (counts[b.room_number] || 0) + 1;
          minutes[b.room_number] = (minutes[b.room_number] || 0) + (bEnd(b) - bStart(b));
        });
        state.report.freqRows = Object.keys(counts).map(function (num) {
          var room = findRoomByNumber(num);
          return { label: room ? room.label : num, count: counts[num], minutes: minutes[num] };
        }).sort(function (a, b) { return b.minutes - a.minutes || b.count - a.count; });
        render();
      });
  }

  function runBookingLog(fromISO, toISO) {
    if (!fromISO || !toISO) { showToast("Bitte Zeitraum wählen."); return; }
    if (toISO < fromISO) { showToast("Das Enddatum muss nach dem Startdatum liegen."); return; }
    state.report.logFrom = fromISO; state.report.logTo = toISO;
    state.report.logLoading = true; state.report.logRows = null; render();
    supabaseClient.from("booking_log").select("id, action, event_at, user_id, acted_by, room_number, workspace_id, booking_date, part, start_time, end_time, prev_start_time, prev_end_time")
      .gte("event_at", fromISO + "T00:00:00").lte("event_at", toISO + "T23:59:59")
      .order("event_at", { ascending: false })
      .then(function (res) {
        state.report.logLoading = false;
        if (res.error) { showToast("Laden fehlgeschlagen: " + res.error.message); console.error(res.error); render(); return; }
        state.report.logRows = res.data || [];
        render();
      });
  }

  // ---------- data loading ----------

  function loadProfiles() {
    return supabaseClient.from("profiles").select("id, full_name, is_admin, group_id, is_active, favorite_start, favorite_end, favorite_workspace_id").then(function (res) {
      if (!res.error) state.profiles = res.data || [];
    });
  }
  function loadGroups() {
    return supabaseClient.from("groups").select("id, name").order("name").then(function (res) {
      if (!res.error) state.groups = res.data || [];
      render();
    });
  }
  function loadRooms() {
    return supabaseClient.from("rooms").select("id, number, label, group_id, sort_order").order("sort_order").then(function (res) {
      if (!res.error) state.rooms = res.data || [];
      render();
    });
  }
  function loadWorkspaces() {
    return supabaseClient.from("workspaces").select("id, room_id, label, sort_order").order("sort_order").then(function (res) {
      if (!res.error) state.workspaces = res.data || [];
      render();
    });
  }
  function loadBookings() {
    return supabaseClient.from("bookings").select("id, user_id, room_number, workspace_id, booking_date, start_time, end_time")
      .gte("booking_date", fmtISO(new Date(Date.now() - 86400000)))
      .then(function (res) { if (!res.error) state.bookings = res.data || []; render(); });
  }
  function loadVacations() {
    return supabaseClient.from("vacations").select("id, user_id, vacation_date").then(function (res) {
      if (!res.error) state.vacations = res.data || []; render();
    });
  }
  function loadPermanentAssignments() {
    return supabaseClient.from("permanent_assignments").select("workspace_id, user_id").then(function (res) {
      var map = {};
      if (!res.error) (res.data || []).forEach(function (row) { map[row.workspace_id] = row.user_id; });
      state.permanentAssignments = map;
      render();
    });
  }

  function loadAllData(afterAuth) {
    state.loadingData = true;
    render();
    Promise.all([loadProfiles(), loadBookings(), loadVacations(), loadPermanentAssignments(), loadGroups(), loadRooms(), loadWorkspaces()]).then(function () {
      state.profile = profileById(state.session.user.id);
      if (!state.profile) {
        // profile row may not exist yet (trigger race right after signup) — retry once shortly
        setTimeout(function () {
          loadProfiles().then(function () {
            state.profile = profileById(state.session.user.id);
            state.loadingData = false;
            render();
          });
        }, 1200);
      } else {
        state.loadingData = false;
        render();
      }
    });
  }

  // ---------- rendering ----------

  function render() {
    var app = document.getElementById("app");
    if (!state.session) { app.innerHTML = renderLogin(); bindLogin(); return; }
    if (!state.profile) {
      app.innerHTML = '<div class="empty-state">Lädt…</div>';
      // Sitzung vorhanden, aber Profil noch nicht geladen (z. B. direkt nach dem Bestätigungslink) — nachladen statt hängenzubleiben.
      if (!state.loadingData) afterLogin();
      return;
    }
    app.innerHTML = renderShell();
    bindShell();
  }

  function renderLogin() {
    var isRegister = state.authMode === "register";
    var html = '<div class="login-wrap">';
    html += '<div class="login-top-row"><button type="button" class="theme-btn" id="themeBtnLogin"></button></div>';
    html += '<div class="logo-big"><img src="' + VAK_LOGO_SRC + '" alt="VAK"></div>';
    html += OFFICE_ILLUSTRATION;
    html += '<div class="login-card">';
    html += '<h2>VAK Büro-Buchung</h2>';
    html += '<p class="intro">' + (isRegister ? "Neues Konto anlegen" : "Bitte anmelden, um deinen Büroarbeitsplatz zu buchen.") + '</p>';
    if (state.authError) html += '<div class="auth-error">' + escapeHtml(state.authError) + '</div>';
    if (state.authInfo) html += '<div class="auth-info">' + escapeHtml(state.authInfo) + '</div>';
    var dr = state.authDraft;
    html += '<form id="authForm" novalidate>';
    if (isRegister) {
      html += '<div class="name-row"><div class="auth-field"><label for="firstName">Vorname</label><input type="text" id="firstName" autocomplete="given-name" placeholder="z. B. Erika" value="' + escapeHtml(dr.firstName) + '"></div>';
      html += '<div class="auth-field"><label for="lastName">Nachname</label><input type="text" id="lastName" autocomplete="family-name" placeholder="z. B. Mustermann" value="' + escapeHtml(dr.lastName) + '"></div></div>';
      html += '<div class="auth-field"><label for="regGroup">Gruppe</label><select id="regGroup"><option value="">– bitte wählen –</option>';
      state.groups.forEach(function (g) { html += '<option value="' + g.id + '"' + (dr.groupId === g.id ? ' selected' : '') + '>' + escapeHtml(g.name) + '</option>'; });
      html += '</select></div>';
    }
    html += '<div class="auth-field"><label for="authEmail">E-Mail' + (isRegister ? ' (dienstlich)' : '') + '</label><input type="email" id="authEmail" autocomplete="email" placeholder="vorname.nachname@vak-sh.de" value="' + escapeHtml(dr.email) + '"></div>';
    html += '<div class="auth-field"><label for="authPassword">Passwort</label><input type="password" id="authPassword" autocomplete="' + (isRegister ? "new-password" : "current-password") + '" placeholder="' + (isRegister ? 'mind. 8 Zeichen: Groß, klein, Zahl, Sonderzeichen' : '') + '" value="' + escapeHtml(dr.password) + '"></div>';
    html += '<button type="submit" class="btn-primary"' + (state.authBusy ? " disabled" : "") + '>' + (state.authBusy ? "Bitte warten…" : (isRegister ? "Konto erstellen" : "Anmelden")) + '</button>';
    html += '</form>';
    html += '<div class="auth-switch">';
    html += isRegister ? 'Schon registriert? <button class="btn-link" id="switchAuth">Zur Anmeldung</button>' : 'Noch kein Konto? <button class="btn-link" id="switchAuth">Konto erstellen</button>';
    html += '</div></div></div>';
    return html;
  }

  function bindLogin() {
    var form = document.getElementById("authForm");
    // Eingaben laufend merken, damit sie ein erneutes Zeichnen (z. B. Fehlermeldung) überstehen
    function syncDraft() {
      var g = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
      var dr = state.authDraft;
      if (g("firstName") !== null) dr.firstName = g("firstName");
      if (g("lastName") !== null) dr.lastName = g("lastName");
      if (g("regGroup") !== null) dr.groupId = g("regGroup");
      dr.email = g("authEmail") || "";
      dr.password = g("authPassword") || "";
    }
    form.addEventListener("input", syncDraft);
    form.addEventListener("change", syncDraft);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      syncDraft();
      var dr = state.authDraft;
      var first = dr.firstName.trim(), last = dr.lastName.trim();
      var fullName = state.authMode === "register" ? ((first && last) ? first + " " + last : null) : null;
      handleAuthSubmit(dr.email.trim(), dr.password, fullName, state.authMode === "register" ? dr.groupId : null);
    });
    if (state.authFocus) {
      var fe = document.getElementById(state.authFocus);
      if (fe) fe.focus();
      state.authFocus = null;
    }
    document.getElementById("switchAuth").addEventListener("click", function () {
      state.authMode = state.authMode === "register" ? "login" : "register";
      state.authError = null; state.authInfo = null;
      render();
    });
    var themeBtnLogin = document.getElementById("themeBtnLogin");
    if (themeBtnLogin) themeBtnLogin.addEventListener("click", toggleTheme);
    applyThemeButtonLabel();
  }

  // Initialen aus dem Namen, z. B. "Sven Carstensen" -> "SC" (Vor- und Nachname).
  function initialsOf(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    var first = parts[0].charAt(0);
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : "";
    return (first + last).toUpperCase();
  }

  function renderShell() {
    var user = state.profile;
    var html = '<header class="topbar">';
    html += '<div class="top-row">';
    html += '<div class="brand"><div class="logo-badge"><img src="' + VAK_LOGO_SRC + '" alt="VAK"></div><div class="sep"></div><div class="brand-text"><div class="title">Büro-Buchung</div><div class="subtitle"><span class="sub-long">VAK Schleswig-Holstein</span><span class="sub-short">VAK SH</span></div></div></div>';
    html += '<div class="top-right"><button type="button" class="theme-btn" id="themeBtn"></button><div class="user-chip"><span class="avatar" title="' + escapeHtml(user ? user.full_name : "") + '" aria-hidden="true">' + escapeHtml(initialsOf(user ? user.full_name : "")) + '</span><span class="uname">' + escapeHtml(user ? user.full_name : "") + '</span><button id="logoutBtn">abmelden</button></div></div>';
    html += '</div>';
    html += '<div class="tabs-band"><nav class="tabs">';
    html += '<button data-tab="buchen" class="' + (state.tab === "buchen" ? "active" : "") + '">Buchen</button>';
    html += '<button data-tab="meine" class="' + (state.tab === "meine" ? "active" : "") + '">Meine</button>';
    html += '<button data-tab="urlaub" class="' + (state.tab === "urlaub" ? "active" : "") + '">Urlaub</button>';
    html += '<button data-tab="uebersicht" class="' + (state.tab === "uebersicht" ? "active" : "") + '">Übersicht</button>';
    html += '</nav></div></header>';
    html += '<main>';
    if (state.tab === "buchen") html += renderBuchen();
    else if (state.tab === "meine") html += renderMeine();
    else if (state.tab === "urlaub") html += renderUrlaub();
    else if (state.tab === "uebersicht") html += renderUebersicht();
    else if (state.tab === "admin") html += renderAdmin();
    else if (state.tab === "auswertung" && REPORTS_ENABLED) html += renderAuswertung();
    html += '</main>';
    html += '<footer class="app-footer"><a id="adminLink">Systemverwaltung</a>' + (REPORTS_ENABLED ? ' · <a id="reportsLink">Auswertungen</a>' : '') + '</footer>';
    if (state.modal) html += renderModal();
    if (state.toastMsg) html += '<div class="toast">' + escapeHtml(state.toastMsg) + '</div>';
    return html;
  }

  function renderDateScroll() {
    var html = '<div class="date-scroll">';
    state.dates.forEach(function (d) {
      var iso = fmtISO(d); var active = iso === state.selectedDate;
      html += '<div class="date-chip ' + (active ? "active" : "") + '" data-date="' + iso + '">';
      html += '<span class="dow">' + DOW[d.getDay()] + '</span><span class="dom">' + d.getDate() + '.' + MONTHS[d.getMonth()] + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  var TL_SPAN = DAY_END - DAY_START;
  function pct(m) { return ((m - DAY_START) / TL_SPAN * 100).toFixed(3) + "%"; }
  function pctW(s, e) { return ((e - s) / TL_SPAN * 100).toFixed(3) + "%"; }

  // Zeitleiste 05–20 Uhr: belegte Zeiten rot, eigene blau, Vergangenheit schraffiert, optional Auswahl
  function timelineHtml(wsId, dateISO, opts) {
    opts = opts || {};
    var html = '<div class="timeline">';

  var MONTH_NAMES = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  // Aufklappbarer Monatskalender für Von/Bis beim Urlaub (Tag antippen = übernehmen)
  function vacCalendarHtml(which) {
    var vf = state.vacForm;
    var ym = vf.calMonth.split("-"); var y = parseInt(ym[0], 10), mo = parseInt(ym[1], 10) - 1;
    var first = new Date(y, mo, 1), days = new Date(y, mo + 1, 0).getDate();
    var lead = (first.getDay() + 6) % 7; // Montag zuerst
    var today = fmtISO(new Date());
    var myVac = {};
    state.vacations.forEach(function (v) { if (v.user_id === state.profile.id) myVac[v.vacation_date] = true; });
    var html = '<div class="vcal" data-vcal="' + which + '">';
    html += '<div class="vcal-head"><button type="button" class="vcal-nav" data-vcal-nav="-1" aria-label="Vormonat">‹</button><b>' + MONTH_NAMES[mo] + ' ' + y + '</b><button type="button" class="vcal-nav" data-vcal-nav="1" aria-label="Folgemonat">›</button></div>';
    html += '<div class="vcal-grid">';
    ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].forEach(function (d) { html += '<span class="vcal-dow">' + d + '</span>'; });
    for (var k = 0; k < lead; k++) html += '<span></span>';
    for (var d = 1; d <= days; d++) {
      var iso = y + "-" + pad(mo + 1) + "-" + pad(d);
      var wd = new Date(y, mo, d).getDay();
      var cls = "vcal-day";
      if (wd === 0 || wd === 6) cls += " we";
      if (iso === vf.start || iso === vf.end) cls += " sel";
      else if (vf.start && vf.end && iso > vf.start && iso < vf.end) cls += " inrange";
      if (myVac[iso]) cls += " vac";
      if (iso === today) cls += " today";
      var disabled = iso < today || (which === "end" && vf.start && iso < vf.start);
      html += '<button type="button" class="' + cls + '" data-vcal-day="' + iso + '"' + (disabled ? ' disabled' : '') + '>' + d + '</button>';
    }
    html += '</div><div class="vcal-foot"><span><i class="lg vac"></i>bereits Urlaub</span><span><i class="lg we"></i>Wochenende</span></div></div>';
    return html;
  }
